<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>イベント手動編集</title>
<style>body{font:16px sans-serif;max-width:850px;margin:20px auto;padding:16px;background:#f5f7fa;color:#182238}input,textarea,select,button{font:inherit;padding:12px;box-sizing:border-box;width:100%;margin:6px 0 16px}textarea{min-height:110px}button{background:#174ea6;color:white;border:0;border-radius:6px;cursor:pointer}label{display:block;font-weight:bold}#status{white-space:pre-wrap}#result{min-height:180px}small{display:block}</style>
<h1>イベント手動編集</h1><p>ここで作った変更内容をGitHub Actionsで反映します。この画面だけでは公開データは変更されません。</p>
<p>公式ページで日付と内容を確認してから編集してください。「非掲載」は削除せず公開を止めます。元に戻せます。</p>
<label>イベント名・地域・IDで検索<input id="search" placeholder="静岡市、花火、IDなど"></label><select id="list" aria-label="イベント選択"></select><button id="add">新しいイベントを追加</button>
<form id="form"><div id="fields"></div><label>操作<select id="action"><option value="edit">修正する</option><option value="hide">非掲載にする</option><option value="restore">再掲載する</option></select></label><button>変更内容を作成</button></form>
<p id="status" role="status"></p><label>GitHubに貼り付ける変更内容<textarea id="result" readonly></textarea></label><button id="copy">変更内容をコピー</button>
<ol><li>変更内容をコピーします。</li><li>GitHubのActions →「Apply Manual Event Change」→「Run workflow」を開きます。</li><li>「変更内容JSON」に貼り付け、実行します。</li><li>成功後、通常の「Automatic Event Data Collection…」を実行するとサイトに公開されます。</li></ol>
<script type="application/json" id="data">__EVENT_DATA__</script><script>
'use strict';
const data=JSON.parse(document.getElementById('data').textContent),$=id=>document.getElementById(id);let selected=null;
for(const [key,label] of Object.entries(data.fields)){let l=document.createElement('label');l.textContent=label;let input=document.createElement(['description','summary'].includes(key)?'textarea':'input');input.id='field_'+key;input.maxLength=12000;l.append(input);$('fields').append(l)}
function load(row){selected=row;for(const k of Object.keys(data.fields))$('field_'+k).value=row?.[k]||'';$('action').innerHTML='';for(const [value,label] of (row?[['edit','修正する'],['hide','非掲載にする'],['restore','再掲載する']]:[['add','追加する']])){let o=new Option(label,value);$('action').add(o)}$('result').value='';$('status').textContent=row?`ID ${row.id} / ${row.hidden?'非掲載':'掲載中'}`:'新しいイベント'}
function filter(){let q=$('search').value.toLowerCase();$('list').innerHTML='';for(const r of data.rows.filter(r=>`${r.id} ${r.title} ${r.city}`.toLowerCase().includes(q))){$('list').add(new Option(`${r.hidden?'【非掲載】':''}${r.id} ${r.title}（${r.city}）`,r.id))}load(data.rows.find(r=>String(r.id)===$('list').value)||null)}
$('search').oninput=filter;$('list').onchange=()=>load(data.rows.find(r=>String(r.id)===$('list').value));$('add').onclick=()=>load(null);
$('form').onsubmit=e=>{e.preventDefault();const action=$('action').value,fields={};for(const k of Object.keys(data.fields)){const v=$('field_'+k).value;if(!selected||v!==(selected[k]||''))fields[k]=v}const change={action,fields,request_id:crypto.randomUUID()};if(selected){change.id=selected.id;change.version=selected.version}if(['add','edit'].includes(action)&&['title','date_str','city','location','official_url'].some(k=>!$('field_'+k).value.trim())){$('status').textContent='イベント名・開催日・市町村・会場・公式URLを入力してください';return}if(action==='hide'&&!confirm('このイベントを非掲載にしますか？'))return;$('result').value=JSON.stringify(change);$('status').textContent='変更内容を作成しました。まだ保存・公開されていません。'};
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('result').value);$('status').textContent='コピーしました。GitHub Actionsへ貼り付けてください'}catch(e){$('result').select();$('status').textContent='変更内容の欄を長押ししてコピーしてください'}};filter();
</script></html>
