name: Check Shizuoka City Calendar
on:
  workflow_dispatch:
concurrency:
  group: shizuoka-calendar-check
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Run parser and publication tests
        run: python -m unittest discover -s tests
      - name: Collect into a temporary copy only
        run: |
          cp events.db "$RUNNER_TEMP/shizuoka-test.db"
          python collect_shizuoka_calendar.py --db "$RUNNER_TEMP/shizuoka-test.db" --backup "$RUNNER_TEMP/shizuoka-before.db" --report "$RUNNER_TEMP/shizuoka-report.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shizuoka-calendar-check
          path: |
            ${{ runner.temp }}/shizuoka-report.json
            ${{ runner.temp }}/shizuoka-test.db
          retention-days: 14
          if-no-files-found: ignore
