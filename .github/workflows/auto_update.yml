name: Collect Municipal Open Data and Publish

on:
  # 毎日 午前3時(JST) = 前日18:00 (UTC)
  schedule:
    - cron: '0 18 * * *'
  # push:
  #   branches:
  #     - main
  #   paths-ignore:
  #     - 'dist/**'
  #     - 'events.db'
  #     - '*.md'
  workflow_dispatch:

concurrency:
  group: auto-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Collect and validate municipal open data (no AI)
        run: python collect_open_data.py --backup "$RUNNER_TEMP/open-data-backup.db" --report "$RUNNER_TEMP/collection-report.json"

      - name: Import checked permanent restaurants
        run: python import_gourmet.py --backup "$RUNNER_TEMP/gourmet-backup/events.db"

      - name: Preserve database before gourmet import
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gourmet-import-backup
          path: ${{ runner.temp }}/gourmet-backup/
          retention-days: 30
          if-no-files-found: ignore

      - name: Regenerate Static HTML Site
        run: |
          python publication_gate.py --backup "$RUNNER_TEMP/publication-review-backup.db"
          python generate_site.py

      - name: Deploy to StarServer via HTTPS Web Deploy (with FTP fallback)
        env:
          WEB_DEPLOY_URL: https://event.very-good.biz/deploy.php
          WEB_DEPLOY_SECRET: ShizuokaEventNavi2026SecretKey
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_REMOTE_DIR: /very-good.biz/public_html/event.very-good.biz
        run: |
          python deploy_web.py || python deploy_ftp.py

      - name: Commit & Push Updated DB and Site back to GitHub Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add events.db dist/
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "Auto: Daily updated events database and static site" || true
            git pull --rebase origin main || true
            git push origin main || echo "Push rejected or no remote changes to push"
          else
            echo "No changes in events.db or dist/ to commit."
          fi

      - name: Save collection report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collection-report
          path: |
            ${{ runner.temp }}/collection-report.json
            ${{ runner.temp }}/open-data-backup.db
          if-no-files-found: ignore

