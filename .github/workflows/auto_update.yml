name: Automatic Event Data Collection & AI Rewrite

on:
  schedule:
    # 毎日 午前3時(JST) = 18:00 (UTC) に自動実行
    - cron: '0 18 * * *'
  workflow_dispatch: # GitHubのウェブ画面から「Run workflow」ボタンで手動実行可能

jobs:
  update-site:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Crawler & AI Rewriter
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python crawler.py

      - name: Regenerate Static Site
        run: |
          python generate_site.py

      - name: Commit & Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add events.db dist/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Chore: Auto-update events & static pages via GitHub Actions" && git push)

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
