name: Automatic Event Data Collection, AI Rewrite & Deploy to StarServer

on:
  schedule:
    # 毎日 午前3時(JST) = 18:00 (UTC) に自動実行
    - cron: '0 18 * * *'
  push:
    branches:
      - main
  workflow_dispatch: # 手動実行ボタン

permissions:
  contents: write

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Crawler & AI Rewriter
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python crawler.py

      - name: Audit & Cleanup Event Data (AI Fact Check)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python audit_and_cleanup_events.py

      - name: Regenerate Static HTML Site
        run: |
          python generate_site.py

      - name: Commit & Push Updated DB and Site back to GitHub Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add events.db dist/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto: Daily updated events database and static site" && git push)

      - name: Deploy to StarServer via Python FTP Script
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_REMOTE_DIR: /very-good.biz/public_html/event.very-good.biz
        run: |
          python deploy_ftp.py
