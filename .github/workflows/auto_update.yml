name: Automatic Event Data Collection, AI Rewrite & Deploy to StarServer

on:
  # 自動収集を一時停止中（再開する場合はコメントを解除してください）
  # schedule:
  #   # 毎日 午前3時(JST) = 18:00 (UTC) に自動実行
  #   - cron: '0 18 * * *'
  # push:
  #   branches:
  #     - main
  #   paths-ignore:
  #     - 'dist/**'
  #     - 'events.db'
  #     - '*.md'
  workflow_dispatch: # 手動実行ボタンのみ保持

concurrency:
  group: auto-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Crawler & AI Rewriter
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python crawler.py

      - name: Audit & Cleanup Event Data (AI Fact Check)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python audit_and_cleanup_events.py

      - name: Regenerate Static HTML Site
        run: |
          python generate_site.py

      - name: Deploy to StarServer via HTTPS Web Deploy (with FTP fallback)
        env:
          WEB_DEPLOY_URL: https://event.very-good.biz/deploy.php
          WEB_DEPLOY_SECRET: ShizuokaEventNavi2026SecretKey
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_REMOTE_DIR: /very-good.biz/public_html/event.very-good.biz
        run: |
          python deploy_web.py || python deploy_ftp.py

      - name: Commit & Push Updated DB and Site back to GitHub Repository
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add events.db dist/
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "Auto: Daily updated events database and static site" || true
            git pull --rebase origin main || true
            git push origin main || echo "Push rejected or no remote changes to push"
          else
            echo "No changes in events.db or dist/ to commit."
          fi

