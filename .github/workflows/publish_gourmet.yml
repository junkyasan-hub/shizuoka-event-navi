name: Publish Reviewed Information

on:
  schedule:
    - cron: '30 18 * * *'
  workflow_dispatch:

concurrency:
  group: auto-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Import checked restaurants and generate site
        run: |
          python import_gourmet.py --backup "$RUNNER_TEMP/gourmet-backup/events.db"
          python publication_gate.py --backup "$RUNNER_TEMP/publication-review-backup.db"
          python generate_site.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gourmet-database-backup
          path: |
            ${{ runner.temp }}/gourmet-backup/
            ${{ runner.temp }}/publication-review-backup.db
          retention-days: 30
          if-no-files-found: ignore
      - name: Save database and generated pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add events.db dist/
          if ! git diff --cached --quiet; then
            git commit -m 'Add checked permanent restaurants and regenerate site'
            git push origin HEAD:main
          fi
      - name: Publish through existing deployment
        env:
          WEB_DEPLOY_URL: https://event.very-good.biz/deploy.php
          WEB_DEPLOY_SECRET: ${{ secrets.WEB_DEPLOY_SECRET }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_REMOTE_DIR: /very-good.biz/public_html/event.very-good.biz
        run: python deploy_web.py || python deploy_ftp.py
