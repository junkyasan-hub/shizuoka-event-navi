name: Apply Verified Event Corrections

on:
  workflow_dispatch:

concurrency:
  group: auto-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Back up and apply the verified corrections
        run: |
          python scripts/correct_verified_events.py --db events.db --backup-dir "$RUNNER_TEMP/event-corrections-backup" --retired-dir dist/events
          python publication_gate.py --backup "$RUNNER_TEMP/publication-review-backup.db"
          python generate_site.py
      - name: Preserve the original database and changed records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: event-corrections-backup
          path: ${{ runner.temp }}/event-corrections-backup/
          if-no-files-found: ignore
          retention-days: 30
      - name: Save the corrected database and pages to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add events.db dist/
          if ! git diff --cached --quiet; then
            git commit -m 'Correct verified event facts and remove unsupported October 19 fireworks listing'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
