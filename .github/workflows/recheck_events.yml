name: Recheck Published Events

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Recheck source facts without changing the published site
        run: |
          cp events.db "$RUNNER_TEMP/recheck-events.db"
          python collect_events.py --db "$RUNNER_TEMP/recheck-events.db" --recheck-only --allow-partial --output "$RUNNER_TEMP/collection-report.json"
      - name: Save the recheck evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: published-event-recheck
          path: ${{ runner.temp }}/collection-report.json
          if-no-files-found: ignore
