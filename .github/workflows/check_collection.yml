name: Check Event Collection

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Fetch and rewrite using a temporary database
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cp events.db "$RUNNER_TEMP/events.db"
          python collect_events.py --db "$RUNNER_TEMP/events.db" --max-events 5 --max-details 10 --allow-partial --output "$RUNNER_TEMP/collection-report.json"
      - name: Save collection report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collection-report
          path: ${{ runner.temp }}/collection-report.json
          if-no-files-found: ignore
