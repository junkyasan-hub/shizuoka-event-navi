gin:0 auto;overflow:hidden;position:relative"></div><footer class="mantine-1kohibp"><div class="mantine-bu4irv"><div class="mantine-pb63e5"><a href="/kids" target="_self" rel="noopener noreferrer" class="mantine-1rphaxh">くふうロコキッズ</a><a href="/sendai" target="_self" rel="noopener noreferrer" class="mantine-1rphaxh">くふうロコ仙台版</a><a href="/shizuoka/terms" target="_self" rel="noopener noreferrer" class="mantine-1rphaxh">利用規約</a><a href="/shizuoka/terms/flyers" target="_self" rel="noopener noreferrer" class="mantine-1rphaxh">チラシ利用規約（店舗様向け）</a><a href="/shizuoka/mediadata" rel="noopener noreferrer" class="mantine-1rphaxh">広告についてのお問い合わせ</a><a href="https://kufu.co.jp/service-privacypolicy/" target="_blank" rel="noopener noreferrer" class="mantine-1rphaxh">プライバシーポリシー</a><a href="https://kufu.co.jp/external-service" target="_blank" rel="noopener noreferrer" class="mantine-1rphaxh">Cookieポリシー</a><a href="https://shizuoka.kufu.co.jp/company.html" target="_blank" rel="noopener noreferrer" class="mantine-1rphaxh">運営会社</a></div><div class="mantine-7kwvjn"><div class="mantine-3jjelc">SNSでもくふうロコしずおかの情報を発信中。今すぐフォロー！</div><div class="mantine-1vlmabv"><a href="https://www.instagram.com/kufuloco_shizuoka" target="_blank" rel="noopener noreferrer"><div class="mantine-Image-root mantine-189yoha" style="width:38px"><figure class="mantine-11nhzn5 mantine-Image-figure"><div class="mantine-qqmv3w mantine-Image-imageWrapper"><img class="mantine-12tzldz mantine-Image-image" src="/assets/sns-icons/instagram-icon.png" alt="instagram" style="object-fit:cover;width:38px;height:38px" loading="lazy"/></div></figure></div></a><a href="https://www.tiktok.com/@kufuloco_shizuoka" target="_blank" rel="noopener noreferrer"><div class="mantine-Image-root mantine-189yoha" style="width:38px"><figure class="mantine-11nhzn5 mantine-Image-figure"><div class="mantine-qqmv3w mantine-Image-imageWrapper"><img class="mantine-12tzldz mantine-Image-image" src="/assets/sns-icons/tiktok-icon.png" alt="tiktok" style="object-fit:cover;width:38px;height:38px" loading="lazy"/></div></figure></div></a></div></div><div class="mantine-1ig1i7l"><div class="mantine-Text-root mantine-1vz81yv">Copyright © Kufu Company Inc.</div></div></div></footer></div></div></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"dehydratedState":{"mutations":[],"queries":[{"state":{"data":{"tagContents":[{"id":5950,"title":"もっと買えばよかった（泣）【老舗の名店】デパ地下超えの手作り惣菜＆焼豚「ご飯が止まらない♡」極上おかず","content":"こんにちは、くふうロコしずおか公式ライターの山ちゃんです。\r\n\r\n今回は、静岡市駿河区馬淵にある『増田焼豚本舗』へ伺いました。\r\n\r\nなぜ、こちらのお店を訪ねることになったのかというと……以前、こちらの焼豚を贈り物として頂戴したことがきっかけです。\r\n\r\nひと口いただいて、そのおいしさにすっかり魅了され、「ぜひ一度、お店にもおうかがいしてみたい」と思ったのです。\r\n\r\nさて、お店はいったいどちらにあるのでしょう。商品に記載されていた住所を頼りに、さっそく車を走らせます。\r\n\r\n##静岡市駿河区馬淵の『増田焼豚本舗』\r\n\r\n昭和29年創業の『増田焼豚本舗』。秘伝のたれと丁寧な手仕事で仕上げる焼豚で、長年地域に愛され続ける名店です。\r\n\r\n焼豚専門のイメージでしたが、手作りお惣菜やお弁当も販売していると聞いて、ますます楽しみ！ゆったりとした駐車場完備で、車での訪問も安心です。\r\n\r\n![masuda (6).jpeg](https://image.loco.kufu.jp/article/1250x_1c41d59e-ae17-4082-8f16-b95c1373038a.jpeg)\r\n\r\n店構えをよく見ると……なんと入口が2カ所！\r\n\r\n向かって左（写真左）は、朝9時30分オープンの「焼豚専用」入口。\r\n正面（写真右）は、午前11時オープンの「お弁当・お惣菜」メインの入口です。\r\n\r\n朝イチで焼豚を狙うもよし、お昼や晩のおかずを探すもよし。時間帯によって違った楽しみ方ができるお店です。\r\n\r\n##人気の焼豚は、朝9時30分から\r\n\r\nお目当ての焼豚は、丸ロース・肩ロース・バラの3種類。脂の入り具合なども選ぶことができ、いずれも100g 647円です。\r\n\r\nショーケースに並ぶ焼豚は、まるで芸術品のよう。\r\n\r\n![masuda (3).jpeg](https://image.loco.kufu.jp/article/1250x_9343959c-b9da-4b83-984b-73c273b5ca42.jpeg)\r\n\r\n美しい飴色に輝き、ほどよい照りと艶をまとった姿は、思わず見入ってしまうほど。精肉卸のお店でもあるそうで、その品質の確かさにも納得です。\r\n\r\n丸ロースは、きめ細やかで美しい肉質。しっとりとした口当たりで、脂が控えめな分、肉そのもののおいしさをじっくり味わえます。\r\n\r\n![増田焼き豚 (2).jpeg](https://image.loco.kufu.jp/article/1250x_1f02e497-8000-432e-9a75-5d977374aae3.jpeg)\r\n\r\n一方のバラは、肉と脂のバランスが絶妙。三枚肉を巻いて形を整えているため、断面には美しい肉の層が現れます。脂の甘みを存分に楽しみたい方には、こちらがおすすめ。\r\n\r\n食感は、丸ロースよりもやや柔らかな印象でした。\r\n\r\n![masuda (5).jpeg](https://image.loco.kufu.jp/article/1250x_bd7ce94b-8400-445c-b62a-49cdac77587a.jpeg)\r\n\r\nそして忘れてはならないのが、添えられた焼豚のたれ。\r\n\r\n静岡産醤油（ヤマシラタマ静岡醤油）ベースの甘じょっぱいたれを焼豚にまとわせれば、ご飯が止まらなくなること間違いなし！\r\n\r\nどれも甲乙つけがたいですが、私はすっきりとした味わいの丸ロース派。子どもは脂の甘みを楽しめるバラがお気に入りでした。\r\n\r\n全3部位を食べ比べできる「サンキューセット（3,900円）」もあるので、ご自宅用はもちろん、焼豚好きの方へのギフトにもぴったりです。\r\n\r\n![増田焼き豚 (3).jpeg](https://image.loco.kufu.jp/article/1250x_2a9c5b3c-25e4-4563-9095-5ae88d993490.jpeg)\r\n\u003csmall\u003eギフト用のスライス焼豚（丸ロース）。このようにパウチされています。\u003c/small\u003e\r\n\r\n商品の詳細は、[店舗Instagram](https://www.instagram.com/yakibuta.masuda01)でご確認ください。\r\n\r\n\r\n##お弁当やお惣菜も、驚くほど豊富でリーズナブル！\r\n\r\n午前11時からオープンする、もう一つの店舗へ。\r\n\r\nこちらには、さまざまなお惣菜やお弁当をはじめ、カットフルーツや手作りプリンまで並んでいます。\r\n\r\nお肉を使ったメニューだけではありません。\r\n\r\n焼き魚や厚焼き玉子、茶碗蒸し、野菜を主役にしたお惣菜など、食卓にあるとうれしい品々がずらり。\r\n\r\n![masuda (7).jpeg](https://image.loco.kufu.jp/article/1250x_cf2cc8cf-6095-43d3-a9bc-92d7e682f1dd.jpeg)\r\n\r\n本当にバラエティー豊かで、どれにしようか迷いながら選ぶ時間もまた楽しいものです。\r\n\r\nあまりに種類が豊富なので、私は惣菜コーナーを中心に、何度も何度も店内を行ったり来たり（笑）。\r\n\r\nお惣菜はバイキング形式で好きな物を好きな量いただくことができます。グラム単位でお値段が変わりますが、価格はとてもお手頃な印象でした。\r\n\r\n「今日は少しだけ」「家族みんなでたっぷり」と、その日の食卓に合わせて選べるのもうれしいところです。\r\n\r\n##野菜のお惣菜から\r\n###コールスローサラダとなす味噌いため\r\n\r\n![masuda.jpeg](https://image.loco.kufu.jp/article/1250x_ca772f3c-1021-4cc4-8c52-76a065eb2fee.jpeg)\r\n\r\nまずいただいたのは、コールスローサラダ。\r\n\r\n酸味控えめでやさしい味わい。やわらかなキャベツにコーンの甘みとハムの旨みが見事に調和しています。\r\n\r\nもう一品は「なす味噌炒め」。つややかななすとパプリカの甘みに、ししとうの辛味が良いアクセント！生姜や味噌の風味が食欲をそそり、白いご飯がたまらなく恋しくなります。\r\n\r\nどちらも、ほっとする「家庭の味」の温かさがありながら、デパ地下デリにも引けを取らないプロのおいしさでした。\r\n\r\n###やっぱりおいしい！『焼豚チャーハン』\r\n焼豚専門店のチャーハンと聞けば、購入前から期待が高まります。\r\n\r\nこちらもグラム単位でお値段が変わるスタイル。今回は、こちらのサイズを選びました。\r\n\r\n![masuda (2).jpeg](https://image.loco.kufu.jp/article/1250x_4e33dc16-204b-4ea3-aabe-2238146a77bf.jpeg)\r\n\r\n私の感覚では、おにぎり1個分より少し多め、といったところでしょうか。\r\n\r\nネギと卵、刻んだナルトのピンク色が見た目にも食欲をそそります。風味豊かなパラリとしたご飯に、もちろん主役の焼豚もしっかり。\r\n\r\nレンゲで口へ運ぶたび、小さな角切りの焼豚が「自分はここにいるよ」とささやかに自己主張して存在感を放ちます。\r\n\r\nひと口、またひと口と食が進み、あっという間に完食。\r\n\r\n（次は、もう少しグラム数の多いものを買おう…。）\r\n\r\nそう心に決めました。\r\n\r\n##結びに\r\n\r\n毎日の食卓に寄り添うお弁当やお惣菜から、贈り物にしたいご馳走級の焼豚まで…幅広い魅力を持つアットホームなお店でした。\r\n\r\n何より印象的だったのは、スタッフの皆さんのフレンドリーで温かな接客です。\r\nAI対応が増える便利で効率的な時代だからこそ、人のぬくもりを感じながら買い物をし、手作りの味をいただけることは、何ものにも代えがたい喜びです。\r\n\r\n受け継がれてきた秘伝のたれと、丁寧につくられる焼豚。\r\nそして、毎日の食卓を思わせる温かな手作りのお惣菜。\r\nそこには、長く地域に愛されてきたお店だからこその、飾らない魅力がありました。\r\n\r\n静岡でおいしい焼豚や手作りのお惣菜をお探しの際には、ぜひ一度、足を運んでみてはいかがでしょうか。\r\n\r\nきっと、心までほっと温まるような「おいしい出会い」が待っています。\r\n\r\n\u003cdiv class=\"facility_information\"\u003e\r\n\u003cb\u003e■増田焼豚本舗\u003c/b\u003e\u003cbr\u003e\r\n住所：静岡県静岡市駿河区馬渕4丁目16−16\u003cbr\u003e\r\n電話：054-287-1599\u003cbr\u003e\r\n営業時間：焼豚9:30～18:30、惣菜11:00～18:30\u003cbr\u003e\r\n定休日：日・祝日\u003cbr\u003e\r\n駐車場：あり\u003cbr\u003e\r\n公式Instagram： \u003ca href=\"https://www.instagram.com/yakibuta.masuda01/\"\u003e増田焼豚本舗\u003c/a\u003e \u003cbr\u003e\r\n\u003c/div\u003e\r\n\u003cbr\u003e\r\n\u003ciframe \r\n\u003ciframe src=\"https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3269.8919169549454!2d138.38738637537384!3d34.95931757282897!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x601a49e7eb3668fd%3A0xf275fd6b6c7b5626!2z5aKX55Sw54S86LGa5pys6IiX!5e0!3m2!1sja!2sjp!4v1786488399590!5m2!1sja!2sjp\" width=\"600\" height=\"450\" style=\"border:0;\" allowfullscreen=\"\" loading=\"lazy\" referrerpolicy=\"strict-origin-when-cross-origin\"\u003e\r\n\r\n\r\n\r\n※この記事は2026年8月時点での情報を基に作成しています。\u003cbr\u003e\r\n※施設・店舗情報は公式サイトおよびGoogleマップの情報を基に作成しています。","prFlag":false,"updatedAt":"2026-09-08T22:21:52.304+09:00","publishedAt":"2026-09-09T06:00:00.000+09:00","thumbnailImageUrl":"https://image.loco.kufu.jp/article/1250x_0845bcb5-eb50-4e4e-a806-306ccf4559ca.jpeg","posterNickname":"","editorName":"山ちゃん","mediaName":"くふうロコしずおか","newsType":"article"},{"id":6042,"title":"今すぐ行かなきゃ♪【はま寿司】「中とろ」100円って本気…？！「旨ねた祭り」が神コスパすぎる◎期間限定なくなり次第終了（泣）","content":"こんにちは、くふうロコしずおか編集部です。\u003cbr\u003e\r\n\r\n全国の「はま寿司」にて、2026年9月8日（火）より「はま寿司の中とろ100円と大漁！旨ねた祭り」が開催中です！\u003cbr\u003e\r\n商品はなくなり次第終了なので、お寿司好きの方はお早めに！\u003cbr\u003e\r\n\r\n![97263-1130-d2dea30773d13336c907bde83485d9b4-2361x1353.jpg](https://image.loco.kufu.jp/article/1250x_fa8c4ae3-c28c-427b-b1df-4e8f0966f30a.jpg)\r\n\r\n\r\n##8日間限定の100円ネタ\r\n赤身と脂身のバランスが良く、とろけるような味わいの「厳選まぐろ中とろ」が、9月8日（火）～9月15日（火）の8日間限定で100円（税込110円）で楽しめます。\u003cbr\u003e\r\n「大葉真いか握り」や「厚切りつぶ貝」も100円（税込110円）で登場です。\u003cbr\u003e\r\n\r\n![97263-1130-02cbdf8e11fd9cc472a88b5e70f337af-3823x2483.jpg](https://image.loco.kufu.jp/article/1250x_ee4b95e5-8e6d-4012-8400-25c7ef7abe40.jpg)\r\n\r\n\r\n##豪華な寿司ネタが勢ぞろい！\r\nさらに「えび（かぼすおろし）」160円（税込176円）やサクサク食感の「黄金カレイフライ握り（タルタルソース）」210円（税込231円）もラインナップ！\u003cbr\u003e\r\n\r\n![97263-1130-c49df26205e6342c733ae1daee142c5e-3900x2982.jpg](https://image.loco.kufu.jp/article/1250x_3ab77f91-4ec4-4e11-b2db-b962fd4033eb.jpg)\r\n\r\n至福の一貫シリーズでは、「鹿児島県産 大切り活〆かんぱち」290円（税込319円）や「一本穴子」480円（税込528円）といった贅沢なネタが味わえます♪\u003cbr\u003e\r\n\r\n![97263-1130-c23f2ca87fe8cd0a2ad4d2eab3426b34-3900x2197.jpg](https://image.loco.kufu.jp/article/1250x_a461589b-f79f-4d00-8e25-8d4236884a53.jpg)\r\n\r\n\r\n##サイドメニュー＆スイーツも充実\r\nサイドメニューには、ほろほろ食感の「特製牛すじ煮込み」290円（税込319円）が登場。\u003cbr\u003e\r\n\r\n![97263-1130-09c4d7cbb49cc4f81520cfe482ac50c8-3900x3258.jpg](https://image.loco.kufu.jp/article/1250x_70510c2a-70f8-4e92-8f6b-0314958e73a5.jpg)\r\n\r\n食後のデザートには「和栗モンブラン」270円（税込297円）や「ブルーベリーチーズケーキ風パルフェ」430円（税込473円）も楽しめますよ。\u003cbr\u003e\r\n\r\n公式Xでは、お食事ご優待券が当たるキャンペーンも実施されるので、ぜひチェックしてお得においしいお寿司を満喫してくださいね。\u003cbr\u003e\r\n\r\n\r\n[▶はま寿司 公式サイトはこちら](https://www.hama-sushi.co.jp/)\u003cbr\u003e\r\n\r\n\r\n\u003cbr\u003e\r\n※記事作成をタイムリーに、かつクオリティ向上をめざして開発した独自AIを、編集部の監修のもと使用しております。\u003cbr\u003e\r\n※この記事は2026年9月時点での情報を基に作成しています。\u003cbr\u003e\r\n※施設・店舗情報は公式サイトおよびGoogleマップの情報を基に作成しています。\u003cbr\u003e\r\n","prFlag":false,"updatedAt":"2026-09-08T22:14:41.506+09:00","publishedAt":"2026-09-09T06:00:00.000+09:00","thumbnailImageUrl":"https://image.loco.kufu.jp/article/1250x_577c390d-a57b-48dd-95b6-a62a896f6787.jpg","posterNickname":"","editorName":"くふうロコしずおか編集部","mediaName":"くふうロコしずおか","newsType":"article"},{"id":6040,"title":"これはたまらん！さすが日本一【浜松ぎょうざ祭り】全国の人気ご当地餃子23店が大集結！キンキンに冷えたビールに広島焼きも","content":"こんにちは、くふうロコしずおか編集部です。\u003cbr\u003e\r\n\r\n餃子好きにはたまらないビッグイベントのお知らせが届きました！\u003cbr\u003e\r\n2026年9月12日（土）と9月13日（日）の2日間、浜松城公園中央芝生広場にて「浜松出世城ぎょうざ祭り2026」が開催されます。\u003cbr\u003e\r\n浜松餃子をはじめとした全国の美味しい餃子やグルメがずらりと並ぶ、熱気あふれるフェスですよ。\u003cbr\u003e\r\n\r\n![139142-18-bc3022facbe5283ede26bf8dff5b44b5-1500x1629.jpg](https://image.loco.kufu.jp/article/1250x_cbf78841-2d76-48f7-8107-7dd0f2da9a7f.jpg)\r\n\r\n\r\n##絶品餃子とご当地グルメを満喫\r\n会場には味わい豊かな浜松餃子エリアを中心に、多彩なグルメブースが登場します♪\u003cbr\u003e\r\n\r\n![139142-18-245b53d895bd098e09f1bd30f035cd57-1122x1402.jpg](https://image.loco.kufu.jp/article/1250x_856c2195-90c5-4fe7-8059-720fcf4a3f19.jpg)\r\n\r\n![139142-18-5c79d68c8cb3326df9746c0188a35390-2560x2492.jpg](https://image.loco.kufu.jp/article/1250x_4081a5da-23dd-4a44-9d48-fc5841719f48.jpg)\r\n\r\n地元浜松だけでなく全国から人気餃子店が23店舗集結。北海道ザンギ餃子や仙台名物牛タン餃子、信州味噌タレねぎ餃子など、全国各地のご当地餃子を食べ比べできるチャンス！\u003cbr\u003e\r\n\r\n![139142-18-275bc738d33999ab56e8d465eb8dd647-1000x667.jpg](https://image.loco.kufu.jp/article/1250x_8d371a30-c17b-42ac-9ee5-39a493fc061b.jpg)\r\n\r\n![139142-18-fd5ce207ac45323131ce5dfb4aaff318-2560x1701.jpg](https://image.loco.kufu.jp/article/1250x_22ee8cd0-5554-4fc7-995f-25e4da2bc5b7.jpg)\r\n\r\nさらに広島焼きなどの鉄板グルメやオリオンビールも用意されていて、お腹いっぱい楽しめること間違いなしです。 \u003cbr\u003e\r\n\r\n![139142-18-dd809ef8f8a0750e4494ce721dc3eb75-1108x1477.jpg](https://image.loco.kufu.jp/article/1250x_724e51ff-3e78-461a-98c9-5e9e42728e38.jpg)\r\n\r\n![139142-18-2e67c9308bfc8fbfa2db09344dc02404-1021x1139.jpg](https://image.loco.kufu.jp/article/1250x_93fbb05d-8ccf-4cab-9ae5-029e8c441960.jpg)\r\n\r\n\r\n##豪華ゲストのステージも盛りだくさん\r\nおいしい食事と一緒に楽しめるステージイベントも見逃せません。\u003cbr\u003e\r\n『元祖！大食い王決定戦』で有名な5代目爆食女王・もえのあずきさんや、アントキの猪木さん、サックス侍など、バラエティ豊かなゲストが続々登場して会場を盛り上げます♪\u003cbr\u003e\r\n\r\n![139142-18-cf4fde0c7df5faa6e3edfd8074b25a80-2400x2400.jpg](https://image.loco.kufu.jp/article/1250x_5510c98c-ec5f-4594-91d4-6965de8d3eac.jpg)\r\n\r\n9月12日（土）には浜松青年会議所主催の「浜松城天守閣プロジェクションマッピング」とのコラボ同時開催も予定されていて見どころ満載です。\u003cbr\u003e\r\n\r\n![139142-18-f010795efc35de7df826b5b936ecb2cd-2000x644.jpg](https://image.loco.kufu.jp/article/1250x_63aa66d3-3c34-4ce3-90ba-e35399e660bc.jpg)\r\n\r\nおいしい餃子を味わいながら楽しいステージやプロジェクションマッピングまで満喫できる2日間。ぜひご家族やお友達と一緒に、浜松城公園へおでかけしてみてくださいね。\u003cbr\u003e\r\n\r\n\r\n\u003cdiv class=\"facility_information\"\u003e\r\n\u003cb\u003e■浜松出世城ぎょうざ祭り2026\u003c/b\u003e\u003cbr\u003e\r\n【開催期間】2026年9月12日（土）・9月13日（日）\u003cbr\u003e\r\n【開催時間】\u003cbr\u003e\r\n9月12日（土）11:00～21:00\u003cbr\u003e\r\n9月13日（日）11:00～18:00\u003cbr\u003e\r\n【開催場所】浜松城公園　中央芝生広場\u003cbr\u003e\r\n静岡県浜松市中央区元城町100-2\u003cbr\u003e\r\n\u003ca href=\"https://gyozaya.org/2026/09/02/shussejo2026/\"\u003e公式サイト\u003c/a\u003e\u003cbr\u003e\r\n\u003ca href=\"https://www.instagram.com/hamamatsu_shussejo_matsuri/\"\u003e公式Instagram\u003c/a\u003e\u003cbr\u003e\u003c/div\u003e\r\n\r\n\r\n\u003ciframe src=\"https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3279.698261317272!2d137.7247333!3d34.712789799999996!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x601ade6025fb0393%3A0x53c8a628ed2055bc!2z5rWc5p2-5Z-O5YWs5ZyS!5e0!3m2!1sja!2sjp!4v1788741696170!5m2!1sja!2sjp\" width=\"600\" height=\"450\" style=\"border:0;\" allowfullscreen=\"\" loading=\"lazy\" referrerpolicy=\"strict-origin-when-cross-origin\"\u003e\u003c/iframe\u003e\r\n\r\n\r\n※記事作成をタイムリーに、かつクオリティ向上をめざして開発した独自AIを、編集部の監修のもと使用しております。\u003cbr\u003e\r\n※この記事は2026年9月時点での情報を基に作成しています。\u003cbr\u003e\r\n※施設・店舗情報は公式サイトおよびGoogleマップの情報を基に作成しています。\u003cbr\u003e\r\n","prFlag":false,"updatedAt":"2026-09-07T15:05:41.824+09:00","publishedAt":"2026-09-08T06:00:00.000+09:00","thumbnailImageUrl":"https://image.loco.kufu.jp/article/1250x_87d572ca-aae1-4155-92ab-d73ed9ccc8a0.jpg","posterNickname":"","editorName":"くふうロコしずおか編集部","mediaName":"くふうロコしずおか","newsType":"article"},{"id":6041,"title":"ウソでしょ…最大28%オフって神【バーガーキング】ワッパー5種が300円引きで激安！「今日から5日間限定」急いでッ","content":"こんにちは、くふうロコしずおか編集部です。\u003cbr\u003e\r\n\r\nバーガーキング®の公式アプリ会員数が1000万人を突破したことを記念して、お得な「ワッパー® 祭り」が開催中です。\u003cbr\u003e\r\nお得なクーポンを使って、人気のバーガーをお安く味わうチャンスです♪\u003cbr\u003e\r\n\r\n\r\n##対象セットが最大28％オフ！300円引きの特別クーポン\r\n![38980-425-cd210c1f6572eed23025cc70156a20a5-1200x1530.jpg](https://image.loco.kufu.jp/article/1250x_7875ec9f-8e99-4b7b-8689-e577bae65e43.jpg)\r\n\r\n2026年9月7日（月）～9月11日（金）の5日間限定で、各日14時から公式アプリにてお得なクーポンが配信されます。\u003cbr\u003e\r\nフレンチフライ（S）とドリンク（M）が付いた対象5種のワッパー® セットが、通常価格より最大28％オフの300円引きで楽しめますよ◎\u003cbr\u003e\r\n\r\n\r\n##人気のワッパー5種がずらり！\r\n![38980-425-b1f2a4306ae746865a5f5c620b7c7a10-1600x1200.jpg](https://image.loco.kufu.jp/article/1250x_48d8c408-f121-4776-9e7d-a547c5e199e3.jpg)\r\n\r\n対象となるのは、人気No.1の「ワッパー® チーズ セット」をはじめ、「ダブルワッパー® チーズ セット」「スモーキーBBQワッパー® セット」「テリヤキワッパー® セット」「スパイシーワッパー® セット」の5種類です。\u003cbr\u003e\r\n店内飲食とテイクアウトのどちらでも利用できるのがうれしいポイントですね♪\u003cbr\u003e\r\n\r\n![38980-425-d0fe4a536d2c7035c4f7d11b6998c828-1600x1200.jpg](https://image.loco.kufu.jp/article/1250x_14f42b16-52a6-4f83-8eee-654ea1e59279.jpg)\r\n\r\n\r\nお得な5日間をお見逃しなく！\u003cbr\u003e\r\nアプリをダウンロードして、お気に入りのワッパー®をお腹いっぱい味わってみてくださいね。\u003cbr\u003e\r\n\r\n\r\n[▶バーガーキング® 公式サイトはこちら](https://www.burgerking.co.jp)\u003cbr\u003e\r\n\r\n\r\n※記事作成をタイムリーに、かつクオリティ向上をめざして開発した独自AIを、編集部の監修のもと使用しております。\u003cbr\u003e\r\n※この記事は2026年9月時点での情報を基に作成しています。\u003cbr\u003e\r\n※施設・店舗情報は公式サイトおよびGoogleマップの情報を基に作成しています。\u003cbr\u003e\r\n","prFlag":false,"updatedAt":"2026-09-07T15:04:48.453+09:00","publishedAt":"2026-09-08T06:00:00.000+09:00","thumbnailImageUrl":"https://image.loco.kufu.jp/article/1250x_421e4940-86e6-424f-9de0-fd6dfb140a81.jpg","posterNickname":"","editorName":"くふうロコしずおか編集部","mediaName":"くふうロコしずおか","newsType":"article"},{"id":6038,"title":"夕焼けライブにミシュラン朝食、SUPまで！「入場無料マルシェ」も◎贅沢すぎる【湖畔フェス】浜名湖・舘山寺でとびっきりの非日常体験を♪","content":"こんにちは、くふうロコしずおか編集部です。\u003cbr\u003e\r\n\r\n浜松市の舘山寺温泉で、湖畔の絶景と極上音楽、グルメが楽しめる野外フェス「萬楽日和（ばんらくびより）」が2026年9月12日（土）と9月13日（日）の2日間にわたって開催されます。\u003cbr\u003e\r\n会場は2021年に閉館した旧ホテル九重の跡地と舘山寺。浜名湖の心地よい風を感じながら、非日常の体験を満喫できるイベントです。\u003cbr\u003e\r\n\r\n![161932-2-fdb3a648e277b5f7914064dd306d730a-3000x1650.jpg](https://image.loco.kufu.jp/article/1250x_8a2e84e5-f52e-446b-b211-7eec806bc64b.jpg)\r\n\r\n\r\n##豪華ライブと絶景サンセット\r\n9月12日（土）は、エリック・クラプトン氏も注目するギタリスト「Toshiki Soejima \u0026 Nahokimama」らが出演するサンセットコンサートを実施。夕暮れ時の浜名湖をバックに極上のサウンドが響き渡ります♪\u003cbr\u003e\r\n\r\n![161932-2-7edd98139ca5185d54bdac0fcd4c7703-1964x2454.jpg](https://image.loco.kufu.jp/article/1250x_ae9bfec5-e4e4-4839-84e0-50c17f618e93.jpg)\r\n\r\n\r\n##ミシュランシェフの特別朝食会＆早朝SUP体験\r\n9月13日（日）には、ミシュラン掲載店で研鑽を積んだ「Chef HIRO」による限定朝食会を開催。自家製ハムのオープンサンドをメインとしたスペシャル朝食を楽しめます。\u003cbr\u003e\r\n\r\n![161932-2-86fb652d2c7314a067c270c4f0ba5570-1964x2454.jpg](https://image.loco.kufu.jp/article/1250x_56b0de47-6463-4d2e-b678-d9f99efb3e3b.jpg)\r\n\r\n波が穏やかな浜名湖では、SUP世界チャンピオンの山本隼人氏による早朝SUP体験も行われます！\u003cbr\u003e\r\n\r\n![161932-2-1f3b1499c4ea17ec2e7f501b5941d53f-1964x2454.jpg](https://image.loco.kufu.jp/article/1250x_9a169f77-3fd4-47d5-bebc-e3bcec7c58ea.jpg)\r\n\r\n\r\n##マルシェや散策も充実\r\n両日ともに地元グルメや雑貨が集まる「萬楽マルシェ」が開催され入場無料で楽しめます。9月12日（土）にはサブ会場の舘山寺で「ENISHI “縁”マルシェ」や歴史ある寺院でのコラボイベントも行われ、温泉街の散策にぴったりです♪\u003cbr\u003e\r\n\r\n![161932-2-38b1ee696a2974eb60ae6d4e986fc7ac-2160x2700.jpg](https://image.loco.kufu.jp/article/1250x_ae15b27b-166b-4c68-a897-32f2f9b8c15f.jpg)\r\n\r\n\r\n\u003cdiv class=\"facility_information\"\u003e\r\n\u003cb\u003e■萬楽日和（ばんらくびより）\u003c/b\u003e\u003cbr\u003e\r\n【開催日時】2026年9月12日（土）12:00～22:00、13日（日）7:30～17:00\u003cbr\u003e\r\n【開催場所】\u003cbr\u003e\r\nメイン会場：ホテル九重跡地（静岡県浜松市中央区舘山寺町2178）\u003cbr\u003e\r\nサブ会場（9/12のみ）：舘山寺（静岡県浜松市中央区舘山寺町2231） \u003cbr\u003e\r\n※雨天の場合、メイン会場を「サンロイヤルホテル浜名湖」に変更して開催いたします。\u003cbr\u003e\r\n\u003ca href=\"https://peatix.com/event/5150153\"\u003e有料コンテンツ予約サイト\u003c/a\u003e\u003cbr\u003e\r\n\u003ca href=\"https://www.banrakubiyori.com\"\u003e公式サイト\u003c/a\u003e\u003cbr\u003e\u003c/div\u003e\r\n\r\n\u003ciframe src=\"https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3277.5738017847925!2d137.615125!3d34.766327499999996!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x601b262fc3640f05%3A0xa7367fcbfdb9584c!2z44CSNDMxLTEyMDkg6Z2Z5bKh55yM5rWc5p2-5biC5Lit5aSu5Yy66IiY5bGx5a-655S677yS77yR77yX77yY!5e0!3m2!1sja!2sjp!4v1788487818729!5m2!1sja!2sjp\" width=\"600\" height=\"450\" style=\"border:0;\" allowfullscreen=\"\" loading=\"lazy\" referrerpolicy=\"strict-origin-when-cross-origin\"\u003e\u003c/iframe\u003e\r\n\r\n\r\n※記事作成をタイムリーに、かつクオリティ向上をめざして開発した独自AIを、編集部の監修のもと使用しております。\u003cbr\u003e\r\n※この記事は2026年9月時点での情報を基に作成しています。\u003cbr\u003e\r\n※施設・店舗情報は公式サイトおよびGoogleマップの情報を基に作成しています。\u003cbr\u003e\r\n","prFlag":false,"updatedAt":"2026-09-04T13:40:24.454+09:00","publishedAt":"2026-09-07T06:00:00.000+09:00","thumbnailImageUrl":"https://image.loco.kufu.jp/article/1250x_700ca5f1-4f9a-4817-9654-47050ad1f7a0.jpg","posterNickname":"","editorName":"くふうロコしずおか編集部","mediaName":"くふうロコしずおか","newsType":"article"},{"id":6037,"title":"お願い売り切れないで～（泣）東京で大行列の贅沢スイーツが【松坂屋静岡店】に降臨♪絶対ゲットしたい！秋限定フレーバー「マロン×カシス」","content":"こんにちは、くふうロコしずおか編集部です。\u003cbr\u003e\r\n\r\n大丸東京店などで大人気のスイーツブランド「N.Y.C.SAND」が、2026年9月9日（水）から9月15日（火）までの期間限定で松坂屋静岡店に出店されます。\u003cbr\u003e\r\nとろとろのキャラメルサンドはもちろん、栗とカシスをあわせた注目フレーバーも数量限定で登場するので見逃せません！\u003cbr\u003e\r\n \r\n\r\n##秋限定の贅沢フレーバー「N.Y. マロンカシスキャラメルサンド」\r\n![107337-197-aed498441303b088538c6bf46be8e38e-1000x1000.jpg](https://image.loco.kufu.jp/article/1250x_236f09d7-645a-4905-a887-9b090a5b711b.jpg)\r\n\u003csmall\u003eN.Y.マロンカシスキャラメルサンド　8個入 2,160円（税込）\u003c/small\u003e\r\n\r\n注目の期間限定商品「N.Y. マロンカシスキャラメルサンド」は、甘酸っぱいカシスクッキーで、芳醇な栗の香りを閉じ込めたマロンキャラメルとミルクチョコレートを挟んだ一品です。\u003cbr\u003e\r\n栗の濃厚なコクとカシスの華やかな酸味が重なり、深みのある味わいを楽しめます。\u003cbr\u003e\r\n\r\n\r\n##定番人気「N.Y. キャラメルサンド」＆ギフトボックスも登場\r\n![107337-197-008403130f614628a00f7ec39beae433-1802x1855.jpg](https://image.loco.kufu.jp/article/1250x_c9ace72d-c713-4ac1-a7b6-edf6b3a4e1cd.jpg)\r\n\u003csmall\u003eN.Y.キャラメルサンド　4個入 756円（税込）～\u003c/small\u003e\r\n\r\n看板商品の「N.Y. キャラメルサンド」は、生クリームと黒糖でとろとろに炊き上げたキャラメルをミルクチョコで包み、香ばしいバタークッキーでサンド！お口の中で絶妙なハーモニーが広がります。\r\n\r\n![107337-197-4498077d71a4c63dd0964a8cb037f579-1000x1000.jpg](https://image.loco.kufu.jp/article/1250x_dd4be88b-a6c0-4b54-8ac6-7d33a80f8d50.jpg)\r\n\u003csmall\u003eN.Y.C.S.ギフトボックス　14個入 3,240円（税込）\u003c/small\u003e\r\n\r\nいろいろな味が楽しめるギフトボックスや「N.Y. スカッチサンド」も販売されます。\u003cbr\u003e\r\n\r\n期間限定出店は1週間のみで、数量限定のため完売してしまう場合もあります。気になる方はぜひお早めに足を運んでみてくださいね。\u003cbr\u003e\r\n\r\n\r\n\u003cdiv class=\"facility_information\"\u003e\r\n\u003cb\u003e■「N.Y.C.SAND」期間限定出店\u003c/b\u003e\u003cbr\u003e\r\n【開催期間】2026年9月9日（水）～9月15日（火）\u003cbr\u003e\r\n【開催時間】10:00～19:30\u003cbr\u003e\r\n【開催場所】松坂屋静岡店 本館地階 ウィークリーグルメ\u003cbr\u003e\r\n静岡県静岡市葵区御幸町10-2\u003cbr\u003e\r\n\u003ca href=\"https://www.matsuzakaya.co.jp/\"\u003e松坂屋静岡店 公式サイト\u003c/a\u003e\u003cbr\u003e\r\n\u003ca href=\"https://www.nycsand.site/\"\u003eN.Y.C.SAND 公式サイト\u003c/a\u003e\u003cbr\u003e\u003c/div\u003e\r\n\r\n\u003ciframe src=\"https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3269.335331218311!2d138.38798079999998!3d34.9732644!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x601a49f770bf682f%3A0xf6259971446066c2!2z5p2-5Z2C5bGL6Z2Z5bKh5bqX!5e0!3m2!1sja!2sjp!4v1779323888558!5m2!1sja!2sjp\" width=\"600\" height=\"450\" style=\"border:0;\" allowfullscreen=\"\" loading=\"lazy\" referrerpolicy=\"no-referrer-when-downgrade\"\u003e\u003c/iframe\u003e\r\n\r\n\r\n※記事作成をタイムリーに、かつクオリティ向上をめざして開発した独自AIを、編集部の監修のもと使用しております。\u003cbr\u003e\r\n※この記事は2026年9月時点での情報を基に作成しています。\u003cbr\u003e\r\n※施設・店舗情報は公式サイトおよびGoogleマップの情報を基に作成しています。\u003cbr\u003e\r\n","prFlag":false,"updatedAt":"2026-09-04T13:41:58.945+09:00","publishedAt":"2026-09-07T06:00:00.000+09:00","thumbnailImageUrl":"https://image.loco.kufu.jp/article/1250x_7d9afc7c-6052-4d1b-b3bf-e1db1e22e1f5.jpg","posterNickname":"","editorName":"くふうロコしずおか編集部","mediaName":"くふうロコしずおか","newsType":"article"},{"id":6032,"title":"見逃したら絶対後悔（泣）【セブンイレブン】秋限定がウマすぎ♡「直径8cm巨大大福」「月見てりやき」お月見新作5選","content":"こんにちは、くふうロコしずおか編集部です。\u003cbr\u003e\r\n\r\n全国のセブン‐イレブンで、お月見をテーマにした注目のスイーツとグルメが順次発売されます。秋の訪れを感じさせる期間限定のラインアップは見逃せません♪\u003cbr\u003e\r\n\r\n\r\n##モチモチ＆濃厚！注目の新作お月見スイーツ\r\n![155396-1153-0aff45decae24de2ae7dd13ed820d159-800x600.jpg](https://image.loco.kufu.jp/article/1250x_29d3ef18-e254-4b8c-bccc-0e741253fa6f.jpg)\r\n\r\n![155396-1153-996f84ac4bc9a3082956291bebce2893-800x600.jpg](https://image.loco.kufu.jp/article/1250x_736f8e14-8736-4c99-afde-39f5a67378bd.jpg)\r\n\r\n2026年9月1日（火）から「お月見プリンクレープ」と満月のような「お月見ロールケーキ」が登場。\r\n\r\n![155396-1153-f37c937487d9a8b634e8f25d45c9ed84-640x480.jpg](https://image.loco.kufu.jp/article/1250x_8eb4f42e-edd0-4c39-bf84-bf254b6b6332.jpg)\r\n\r\n![155396-1153-3848bd2f9afc45490f684aa4d72e6f07-640x480.jpg](https://image.loco.kufu.jp/article/1250x_ee5cd6ef-e471-44a5-a40d-10788476fcb0.jpg)\r\n\r\nさらに9月15日（火）からは、夜空をイメージした「お月見ぜんざい」や、直径約8cmとビッグサイズの「大きなお月様大福 カスタードホイップ」も販売されます。\u003cbr\u003e\r\n\r\n\r\n##ボリューム満点♪月見てりやきバーガー\r\nグルメメニューも見逃せません！\u003cbr\u003e\r\n9月9日（水）からは、満月に見立てた目玉焼きを挟んだ「月見てりやきバーガー」が登場。甘辛いソースと卵のコクが合わさった絶品バーガーです。\u003cbr\u003e\r\n\r\n身近なセブン‐イレブンで、秋のお月見気分を満喫してみませんか♪ \u003cbr\u003e\r\n\r\n![155396-1153-09841ac5d5be4d733d11afc9d7804881-640x480.jpg](https://image.loco.kufu.jp/article/1250x_004a956f-231d-4103-8f4a-eae5cdb38eed.jpg)\r\n\r\n\r\n[▶セブン‐イレブン 公式サイトはこちら](https://www.sej.co.jp/)\u003cbr\u003e\r\n\r\n\r\n※記事作成をタイムリーに、かつクオリティ向上をめざして開発した独自AIを、編集部の監修のもと使用しております。\u003cbr\u003e\r\n※この記事は2026年9月時点での情報を基に作成しています。\u003cbr\u003e\r\n※施設・店舗情報は公式サイトおよびGoogleマップの情報を基に作成しています。\u003cbr\u003e\r\n","prFlag":false,"updatedAt":"2026-09-04T13:25:07.021+09:00","publishedAt":"2026-09-06T06:00:00.000+09:00","thumbnailImageUrl":"https://image.loco.kufu.jp/article/1250x_4b72f00b-34d3-4c23-bbc9-1e0fa7bd1bd3.jpg","posterNickname":"","editorName":"くふうロコしずおか編集部","mediaName":"くふうロコしずおか","newsType":"article"},{"id":6033,"title":"秋の高級食材食べ尽くし！【松茸＆サーモン食べ放題】寿司・お造り・天ぷら・丼・ピザ・グラタン…とろける贅沢料理のオンパレード♪","content":"こんにちは、くふうロコしずおか編集部です。\u003cbr\u003e\r\n\r\n和食ファミレス「和食さと」から、秋の味覚を思う存分味わえる魅力的な新コースが登場。2026年9月3日（木）から10月14日（水）までの期間限定で、「松茸料理＆サーモン料理食べ放題」が楽しめますよ♪\u003cbr\u003e\r\n\r\n\r\n##香り高い秋の味覚！松茸づくしの一品料理\r\n![122416-1016-17310dc54be494035081722ee44e90f4-500x450.jpg](https://image.loco.kufu.jp/article/1250x_d6dd75a6-01fe-465a-a550-f2aae17138ef.jpg)\r\n\r\n今回のコースでは、秋の味覚の王様・松茸を贅沢に使った料理が食べ放題になります！\u003cbr\u003e\r\n芳醇な香りが広がる「松茸ごはん」をはじめ、「松茸の手巻き寿司」や「松茸のお吸い物」など、特別なメニューを心ゆくまで味わえます。\u003cbr\u003e\r\n\r\n\r\n##とろける美味しさ！国産サーモンも食べ放題\r\n![122416-1016-18a8a1accddddea452554fb83edb8f04-500x450.jpg](https://image.loco.kufu.jp/article/1250x_01b56f40-a641-4fd1-8898-61d96a1b7621.jpg)\r\n\r\nさらに、身がしまって脂がのった国産サーモンを満喫できるメニューも大集合！\u003cbr\u003e\r\n定番の「サーモンお造り」や「サーモンにぎり」に加え、香ばしさがたまらない「サーモン炙りにぎり」や「サーモン天ぷら」もラインアップ。大人から子どもまで大満足の美味しさです！\u003cbr\u003e\r\n\r\n\r\n##ピザやグラタンも！多彩な和洋メニュー\r\n![122416-1016-07e611772a4727fcf041a11efda5ea10-1740x2465.jpg](https://image.loco.kufu.jp/article/1250x_31323abf-218a-45a4-9c83-b0c45213ce42.jpg)\r\n\r\nおつまみにぴったりな「サーモンユッケ風」や「サーモンタルタル」のほか、「松茸と舞茸のマカロニチーズグラタン」「松茸と舞茸のピザフォカッチャ」といった洋風メニューも楽しめます。〆には「ミニサーモン丼」や「松茸とろろそば・うどん」も用意されていますよ。\u003cbr\u003e\r\n\r\nしゃぶしゃぶやすき焼き、焼肉のコースと一緒に、秋の贅沢な味覚をぜひ堪能してみてくださいね！\u003cbr\u003e\r\n\r\n\r\n\u003cdiv class=\"facility_information\"\u003e\r\n\u003cb\u003e■松茸料理＆サーモン料理食べ放題コース\u003c/b\u003e\u003cbr\u003e\r\n【実施期間】2026年9月3日（木）～10月14日（水）予定\u003cbr\u003e\r\n【対象店舗】和食さと全店（202店舗）\u003cbr\u003e\r\n\u003ca href=\"https://sato-res.com/sato/\"\u003e公式サイト\u003c/a\u003e\u003cbr\u003e\u003c/div\u003e\r\n\r\n\r\n※記事作成をタイムリーに、かつクオリティ向上をめざして開発した独自AIを、編集部の監修のもと使用しております。\u003cbr\u003e\r\n※この記事は2026年9月時点での情報を基に作成しています。\u003cbr\u003e\r\n※施設・店舗情報は公式サイトおよびGoogleマップの情報を基に作成しています。\u003cbr\u003e\r\n","prFlag":false,"updatedAt":"2026-09-04T13:26:17.909+09:00","publishedAt":"2026-09-06T06:00:00.000+09:00","thumbnailImageUrl":"https://image.loco.kufu.jp/article/1250x_5b6889c5-823d-4319-ba78-c8d566d91f53.jpg","posterNickname":"","editorName":"くふうロコしずおか編集部","mediaName":"くふうロコしずおか","newsType":"article"},{"id":6035,"title":"「バカうまい」「大感動」今すぐ買いに行きたい【ファミマ】史上最多コラボ祭！黄金の味ファミチキ＆20倍巨大化パイの実など！再現度すごすぎ4選","content":"こんにちは、くふうロコしずおか公式ライターのこしあんです。\u003cbr\u003e\r\n\r\nファミリーマートでは2026年9月1日（火）から、創立45周年を記念した大注目のキャンペーン「ファミマとコラボ祭」がスタート！\u003cbr\u003e\r\nファミマ史上最多となる全15社とタッグを組んだ全18種類の商品が登場し、9月1日（火）から11品、9月8日（火）から7品が発売されます。\u003cbr\u003e\r\n\r\n楽しみすぎて意気揚々とキャンペーン初日に来店し、気になる4品をゲット。率直な感想をお届けします。\u003cbr\u003e\r\n\r\n\r\n##「エバラ監修　ファミチキ（焼肉のたれ味）」税込258円\r\n![IMG_4177.jpeg](https://image.loco.kufu.jp/article/1250x_2be4534d-cb51-4618-a91b-8ca5fde0ca97.jpeg)\r\n\r\nエバラ焼肉のたれ「黄金の味（中辛）」の味わいを再現したファミチキ。いちばん楽しみにしてたやつ！\u003cbr\u003e\r\n\r\nうんまぁぁぁぁぁ！\u003cbr\u003e\r\n甘辛スパイシーでジューシー♪\u003cbr\u003e\r\n\r\nほんのり焦げたところがまた香ばしくておいしい。もしゃもしゃかぶりつくのが最高ですね。\u003cbr\u003e\r\nこれはたまらんです。バカうまい。酒が飲みたい。今すぐまた買いに行きたい。\u003cbr\u003e\r\n\r\nご飯にのせて上からさらに焼肉のたれをかけたら、めちゃくちゃおいしそう！次は絶対それやる！\u003cbr\u003e\r\n\r\nひとつだけ残念だったのは、POPやCMで見たような黄金の味の袋に入れてくれるのかと思っていたらいつもの袋だったこと…。HPをよく見たら「※袋のデザインは異なります」ってちゃんと書いてあった…泣\r\n\r\n\r\n##「日清のどん兵衛 どんぎつねむすび」税込248円\r\n![IMG_4174.jpeg](https://image.loco.kufu.jp/article/1250x_794b954f-474a-44d5-8c72-504f927f54e3.jpeg)\r\n\r\nあの「どん兵衛」がおむすびに！\u003cbr\u003e\r\n東日本と西日本で味付けが違うというのもちゃんと再現されていて、そのこだわりがいいですね。\u003cbr\u003e\r\nパッケージに「※麺は入っておりません」と書かれているのがちょっとおもしろかったです。\u003cbr\u003e\r\n\r\n![IMG_4180.jpeg](https://image.loco.kufu.jp/article/1250x_1868a1fa-e8ea-4f27-93af-5832dd03e6f4.jpeg)\r\n\r\n![IMG_4181.jpeg](https://image.loco.kufu.jp/article/1250x_27930529-d2b3-4769-a617-db3d3852b16f.jpeg)\r\n\r\nおあげに包まれているのではなく、おむすびの上にのっかっているんですよね。ちゃんと「どん兵衛」なんです。後ろ姿は「びんぼっちゃま」スタイルですね。\u003cbr\u003e\r\nごはんも、上品なお出汁がきいたあっさりめの優しい味わいで、ピンク色のやつは紅ショウガかと思ったら刻んだかまぼこでした。これもどん兵衛の具を再現しているんですね！\u003cbr\u003e\r\n\r\n![IMG_4182.jpeg](https://image.loco.kufu.jp/article/1250x_16e6b74b-472a-4b9b-8366-06d554389034.jpeg)\r\n\r\nおあげジューシー♪　お出汁しみしみ♪\u003cbr\u003e\r\n\r\nすべてがちゃんと「どん兵衛」していることに大感動でした。\u003cbr\u003e\r\n\r\n\r\n##「パイの実みたいなデニッシュ」税込180円\r\n![IMG_4175.jpeg](https://image.loco.kufu.jp/article/1250x_dbf3fb69-f924-4eda-b517-3f7784132e8d.jpeg)\r\n\r\n![IMG_4178.jpeg](https://image.loco.kufu.jp/article/1250x_1de62995-eb50-4df2-b762-5ab13fe05d83.jpeg)\r\n\r\nこういうのってなぜかテンション上がっちゃうんですよねぇ。本家「パイの実」の約20倍サイズ。このビジュアルだけでなんか楽しい。巨大な食べ物がときどき降ってくる「ちいかわ」の世界みたい。\u003cbr\u003e\r\n\r\n![IMG_4179.jpeg](https://image.loco.kufu.jp/article/1250x_34af75b6-365d-4ca7-921b-c455f0dc0163.jpeg)\r\n\r\nけっこうずっしりボリューミーで、チョコもたっぷり入ってます！\u003cbr\u003e\r\nデニッシュだけど真ん中がちょっとパイっぽくて、ほんのりサクサクでおいしい。\u003cbr\u003e\r\n半分はトースターで焼いてみたら、サクサクのパイ感が出て、パン屋さんみたいな味わいに♪\u003cbr\u003e\r\n\r\n\r\n##「ミルクチョコレートエクレア」税込238円\r\n![IMG_4176.jpeg](https://image.loco.kufu.jp/article/1250x_0f1db4f0-df8c-4403-a4cc-2d91376986a8.jpeg)\r\n\r\n今年100周年を迎える明治チョコレートを使ったエクレア。\u003cbr\u003e\r\nクリームも生地もコーティングもチョコという贅沢さ♡\u003cbr\u003e\r\n\r\n![IMG_4184.jpeg](https://image.loco.kufu.jp/article/1250x_d750f211-a2a5-4341-8664-fd760004b02c.jpeg)\r\n\r\nクリームはぽってりしていて甘すぎず、チョコづくしなのにくどさはなくて、ミルクチョコレートの上品な味わいが広がります。\u003cbr\u003e\r\n\r\n\u003cbr\u003e\r\nさすがファミリーマート45周年、「あの味！あの味！」が楽しい商品ばかり。見ているだけでワクワクしちゃう豪華なラインナップ。しばらく通いつめてしまいそうです。\u003cbr\u003e\r\n\r\n\u003cbr\u003e\r\n[▶ファミリーマート公式サイトはこちら](https://www.family.co.jp/campaign/spot/2609_fmcollab45_cp_PxUFlwgK.html)\u003cbr\u003e\r\n\r\n\r\n\u003cbr\u003e\r\n※この記事は2026年9月時点での情報を基に作成しています。\u003cbr\u003e\r\n","prFlag":false,"updatedAt":"2026-09-04T14:42:34.871+09:00","publishedAt":"2026-09-06T06:00:00.000+09:00","thumbnailImageUrl":"https://image.loco.kufu.jp/article/1250x_432a3afd-15bd-4c53-852f-c088119cea39.jpeg","posterNickname":"","editorName":"こしあん","mediaName":"くふうロコしずおか","newsType":"article"},{"id":6031,"title":"全23種って本気！？【キルフェボン】秋限定タルトが大集合♪栗・梨・ブドウ・柿・イチジクから抹茶まで！誘惑がすごい（泣）","content":"こんにちは、くふうロコしずおか編集部です。\u003cbr\u003e\r\n\r\nタルト専門店「キル フェ ボン」で、2026年9月1日（火）から秋メニュー第1弾の販売がスタートしました。\u003cbr\u003e\r\n栗や梨、イチジクなど旬の果実をたっぷり使ったタルトが全23種も登場しています♪\u003cbr\u003e\r\n\r\n\r\n##秋のごちそうが目白押し\r\n![117972-92-84df4b220ad30a0fa4c2f9ba12a8d3f0-2000x1333.jpg](https://image.loco.kufu.jp/article/1250x_a6bd5ffb-6f7c-48c4-9f7f-619aad2481aa.jpg)\r\n\u003csmall\u003eオータムフルーツのタルト\u003c/small\u003e\r\n\r\n今回の目玉は、ブドウ・柿・イチジクをあわせた「オータムフルーツのタルト」（9月15日（火）発売予定）や、コクのある栗クリームにカシス＆木苺ジャムが効いた「栗とメイプルのタルト」。\u003cbr\u003e\r\n\r\n![117972-92-1c59fae4a7fb17d767fcfadff4324b96-2000x1333.jpg](https://image.loco.kufu.jp/article/1250x_5046f8f8-2b5a-4b5b-9a91-1f78384842c7.jpg)\r\n\u003csmall\u003e栗とメイプルのタルト\u003c/small\u003e\r\n\r\nさらに、ジューシーな「北海道産 “らいでん”メロンのタルト」など、秋の贅沢を丸ごと堪能できる逸品ばかりです◎\u003cbr\u003e\r\n\r\n\r\n##抹茶や和の素材を使ったタルトも♪\r\n![117972-92-a38c8833e1cf3768eb0b35c5d0a12193-2000x1333.jpg](https://image.loco.kufu.jp/article/1250x_63962c2e-ba3a-42df-8f71-64c5556802eb.jpg)\r\n\u003csmall\u003e京都府宇治市産 “辻喜”抹茶のテリーヌのタルト\u003c/small\u003e\r\n\r\n注目は、宇治抹茶「辻喜」の覆い下1番茶のみを厳選した「京都府宇治市産 “辻喜”抹茶のテリーヌのタルト」や「黒洲きな粉とほうじ茶のタルト ～ショートケーキ風～」といったこだわりの和メニュー！\u003cbr\u003e\r\n\r\n![117972-92-232cd59e1dfc457a0f2a8e891d14991c-2000x1333.jpg](https://image.loco.kufu.jp/article/1250x_87716241-4327-4d8e-9be5-1b1655d3043b.jpg)\r\n\u003csmall\u003e黒洲きな粉とほうじ茶のタルト ～ショートケーキ風～\u003c/small\u003e\r\n\r\n甘酸っぱい「茨城県産 和梨 “恵水”のタルト」や「モンブラン」など、目移りするラインナップが揃っています。\u003cbr\u003e\r\n\r\n自分へのご褒美や手土産に、ぜひ旬の味わいを楽しんでみてくださいね！\u003cbr\u003e\r\n\r\n\r\n[▶キル フェ ボン 公式サイトはこちら](https://www.quil-fait-bon.com/)\u003cbr\u003e\r\n\r\n\r\n\u003cdiv class=\"facility_information\"\u003e\r\n\u003cb\u003e■キル フェ ボン 静岡\u003c/b\u003e\u003cbr\u003e\r\n住所：静岡県静岡市葵区両替町2-4-15\u003cbr\u003e\r\n営業時間：11:00～19:00\u003cbr\u003e\r\n\r\n\u003ciframe src=\"https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3269.3093186352676!2d138.38268739999998!3d34.9739161!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x601a4a1e1edd004d%3A0x3cc91f40019a7c8b!2z44Kt44Or44OV44Kn44Oc44OzIOmdmeWyoQ!5e0!3m2!1sja!2sjp!4v1764905441912!5m2!1sja!2sjp\" width=\"600\" height=\"450\" style=\"border:0;\" allowfullscreen=\"\" loading=\"lazy\" referrerpolicy=\"no-referrer-when-downgrade\"\u003e\u003c/iframe\u003e\u003cbr\u003e\r\n\r\n\u003cbr\u003e\r\n\u003cb\u003e■キル フェ ボン 浜松\u003c/b\u003e\u003cbr\u003e\r\n住所：静岡県浜松市中央区池町222-18\u003cbr\u003e\r\n営業時間：11:00～19:00\u003cbr\u003e\r\n\r\n\u003ciframe src=\"https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3279.854604590625!2d137.7294549!3d34.708847!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x601ade649dc4cf45%3A0x90da28dd7913ace0!2z44Kt44Or44OV44Kn44Oc44OzIOa1nOadvg!5e0!3m2!1sja!2sjp!4v1764905482175!5m2!1sja!2sjp\" width=\"600\" height=\"450\" style=\"border:0;\" allowfullscreen=\"\" loading=\"lazy\" referrerpolicy=\"no-referrer-when-downgrade\"\u003e\u003c/iframe\u003e\u003c/div\u003e\r\n\r\n\r\n※記事作成をタイムリーに、かつクオリティ向上をめざして開発した独自AIを、編集部の監修のもと使用しております。\u003cbr\u003e\r\n※この記事は2026年9月時点での情報を基に作成しています。\u003cbr\u003e\r\n※施設・店舗情報は公式サイトおよびGoogleマップの情報を基に作成しています。\u003cbr\u003e\r\n","prFlag":false,"updatedAt":"2026-09-04T13:16:11.692+09:00","publishedAt":"2026-09-05T06:00:00.000+09:00","thumbnailImageUrl":"https://image.loco.kufu.jp/article/1250x_17911556-14a6-44f3-8c8a-602754f1ac8b.jpg","posterNickname":"","editorName":"くふうロコしずおか編集部","mediaName":"くふうロコしずおか","newsType":"article"},{"id":6028,"title":"ジョブチューン\"満場一致合格\"で鬼売れ【築地銀だこ】ウソ、1日限定でお得！「絶対買いスイーツ」県内5店舗だけ（泣）","content":"こんにちは、くふうロコしずおか編集部です。\u003cbr\u003e\r\n\r\n9月6日の「クロワッサンたい焼の日」に合わせた、とっても魅力的な特別キャンペーンが開催されます！\u003cbr\u003e\r\n全国の「築地銀だこ」のクロワッサンたい焼取扱店舗や「銀のあん」店舗にて、2026年9月6日（日）限定で「クロワッサンたい焼5匹入りセット」が1匹分お得な特別価格で登場しますよ♪\u003cbr\u003e\r\nサクサクの香ばしい生地ともちっと食感がたまらないオリジナルスイーツをお得に味わえる大チャンスです。\u003cbr\u003e\r\n\r\n\r\n##9月6日はクロの日！1匹分お得な5匹入りセット\r\n![31747-756-64fa5fe66c731d34a39d10c20d0257d6-1200x630.jpg](https://image.loco.kufu.jp/article/1250x_0f2bfbe9-63c7-4f60-a986-94786abd517b.jpg)\r\n\r\n9月6日（日）の当日限定で、「クロワッサンたい焼5匹入りセット」が “クロ（96）” にちなんで960円（税込1,036円）で販売されます！\u003cbr\u003e\r\n通常の1匹分がお得になる超お買い得なセットです。味は定番人気のあずきとカスタードの2種類から自由な組み合わせを選べますよ。\u003cbr\u003e\r\n\r\n\r\n##焼き立てより常温が旨い！？手土産や食べ歩きに大好評\r\n![31747-756-6184fb4477e27d779c66b97528133917-1414x1305.jpg](https://image.loco.kufu.jp/article/1250x_038dcefb-5223-4bdf-8eba-237e29cfca43.jpg)\r\n\r\nクロワッサンたい焼の極上サクサク食感の秘密は、高温で焼き上げた24層の特製クロワッサン生地。片面にザラメ糖がキャラメリゼされていて、香ばしい風味と食感がアクセントになっています。\u003cbr\u003e\r\n時間が経っても生地がしんなりせず冷めても美味しいので、差し入れや手土産、食べ歩きにもぴったりです◎\u003cbr\u003e\r\n\r\n\r\n##『ジョブチューン』で満場一致合格\r\n![31747-756-ff701550f7d26cc188c159448711dc47-426x532.jpg](https://image.loco.kufu.jp/article/1250x_beb266ca-3bd1-4b42-8c3b-91920ce9b4e7.jpg)\r\n\r\n今回のキャンペーンでは対象外の商品となりますが、期間限定商品「クロワッサンたい焼プリン」が、8月15日に放送された『ジョブチューン』のジャッジ企画で  “満場一致合格”  をゲット！\u003cbr\u003e\r\nこちらの商品もあわせて楽しんでみてくださいね♪\u003cbr\u003e\r\n\r\n\r\n\u003cdiv class=\"facility_information\"\u003e\r\n\u003cb\u003e■「クロワッサンたい焼の日」キャンペーン\u003c/b\u003e\u003cbr\u003e\r\n【実施日】2026年9月6日（日） ※当日限定\u003cbr\u003e\r\n【実施店舗】全国の「築地銀だこ」のクロワッサンたい焼取扱店舗（一部店舗除く）と 全国の「銀のあん」店舗\u003cbr\u003e\r\n\u003ca href=\"https://www.gindaco.com/news/detail/5401/\"\u003e公式サイト\u003c/a\u003e\u003cbr\u003e\r\n\u003ca href=\"https://campaign.gindaco.com/news/CW2026_0828%20.pdf\"\u003e「築地銀だこ」実施店舗リスト\u003c/a\u003e\u003cbr\u003e\r\n\u003ca href=\"https://campaign.gindaco.com/news/CWginnoan2026_0828%20.pdf\"\u003e「銀のあん」実施店舗リスト\u003c/a\u003e\u003cbr\u003e\u003c/div\u003e\r\n\r\n\r\n※記事作成をタイムリーに、かつクオリティ向上をめざして開発した独自AIを、編集部の監修のもと使用しております。\u003cbr\u003e\r\n※この記事は2026年9月時点での情報を基に作成しています。\u003cbr\u003e\r\n※施設・店舗情報は公式サイトおよびGoogleマップの情報を基に作成しています。\u003cbr\u003e\r\n","prFlag":false,"updatedAt":"2026-09-03T13:20:31.109+09:00","publishedAt":"2026-09-04T06:00:00.000+09:00","thumbnailImageUrl":"https://image.loco.kufu.jp/article/1250x_d0ef90e8-3469-4300-838c-0817e15d1a3a.jpg","posterNickname":"","editorName":"くふうロコしずおか編集部","mediaName":"くふうロコしずおか","newsType":"article"},{"id":6026,"title":"60種ぜーんぶ食べ放題♪ホテルで贅沢な【秋バイキング】富士山サーモンから出来立てモンブランまで！「限定メニューあり」食欲の秋が爆発","content":"こんにちは、くふうロコしずおか編集部です。\u003cbr\u003e\r\n\r\nつま恋リゾート彩の郷で、2026年9月1日（火）から11月30日（月）までの期間限定で秋のディナーバイキング「Autumn Gastronomy 2026」が開催されます。\u003cbr\u003e\r\n定番の約60種のメニューに加え、旬の味覚を詰め込み、和・洋・中を織り交ぜた特別メニューがたっぷり登場しますよ♪\u003cbr\u003e\r\n\r\n\r\n##地元グルメや旬の味覚がずらり！\r\n期間中の通期メニューには、遠州名物お芋入りおさくらごはんや、富士山サーモンの刺身、若鶏のタンタン鍋など魅力的な料理が勢ぞろい。\u003cbr\u003e\r\n\r\n![tsumagoirestaurantfoodfair040.jpg](https://image.loco.kufu.jp/article/1250x_7aa2d9b1-6207-48de-95d1-42aef44fbf71.jpg)\r\n\r\n![31330-381-cdb6bb1b38378199de0c68f2e4dd80cc-2000x1125.jpg](https://image.loco.kufu.jp/article/1250x_56b207b4-9b6b-48df-8c08-46683c5f39ab.jpg)\r\n\r\nさらに、平茸の天ぷらや秋刀魚の竜田揚げ、ごま・柚子みそ・生姜醤油で味わう里芋のせいろ蒸しなど、秋の実りを存分に堪能できるラインナップです♪\u003cbr\u003e\r\n\r\n\r\n##日替わりで楽しめる限定メニュー\r\n日替わりメニューも充実していて、豚バラ肉と秋ナスのみそ炒めや、ビストロ風牛スジと秋根菜のトマト煮込みなどが楽しめます。\u003cbr\u003e\r\n\r\n![31330-381-869217ab3ae603c940aaf047074ba559-2000x1125.jpg](https://image.loco.kufu.jp/article/1250x_610f700f-695e-46f9-a7a0-251c237331ba.jpg)\r\n\r\nそのほか、赤魚の西京焼きやサーモンの唐揚げ木ノ子餡かけ、秋鮭とほうれん草のクリームパスタ、チキンロースト南瓜の栗ームグラタン風など、何度訪れても新しい美味しさに出会えますよ◎\u003cbr\u003e\r\n\r\n![31330-381-8d0616d7fec77432f015c7acbb00daa2-2000x1125.jpg](https://image.loco.kufu.jp/article/1250x_e84e0124-e6c9-4b0b-b44e-69aa04c7b452.jpg)\r\n\r\n\r\n##目の前で仕上げる絶品スイーツ♪\r\nデザートには栗のモンブランのほか、会場で一つ一つ丁寧に焼き上げるスイートポテトや、目の前で手仕事で形づくる蒸し栗餡の茶巾絞りが日替わりで登場します！\u003cbr\u003e\r\n出来立ての香りと味わいをぜひ楽しんでくださいね。\u003cbr\u003e\r\n\r\n![31330-381-77246b92f3a42dead2a90840e91d686b-2000x1125.jpg](https://image.loco.kufu.jp/article/1250x_26da5a8d-49ec-4401-89bd-2bc16c9e1631.jpg)\r\n\r\n秋の訪れを感じる特別なディナーバイキングで、お腹も心も満たされる至福のひとときを過ごしてみてはいかがでしょうか♪\u003cbr\u003e\r\n\r\n\u003csmall\u003e※写真はイメージです。\u003cbr\u003e\r\n※仕入れ状況により、料理フェアの期間・内容は変更となる場合がございます。\u003c/small\u003e\u003cbr\u003e\r\n\r\n\r\n\u003cdiv class=\"facility_information\"\u003e\r\n\u003cb\u003e■秋のバイキング『Autumn Gastronomy 2026』～秋の実りを楽しむ 美味のひととき～\u003c/b\u003e\u003cbr\u003e\r\n【開催期間】2026年9月1日（火）～11月30日（月）\u003cbr\u003e\r\n【開催時間】18：00～21：00（最終入場 20：00）\u003cbr\u003e\r\n【料金（税込）】大人6,600円、小学生4,620円、幼児（3才以上）3,300円\u003cbr\u003e\r\n※夕食のみのご利用可（ご予約をおすすめします）\u003cbr\u003e\r\n【開催場所】つま恋リゾート彩の郷　ホテルメインロビーB1F　レストラン ビュッフェテラス\u003cbr\u003e\r\n静岡県掛川市満水2000\u003cbr\u003e\r\n\u003ca href=\"https://hmihotelgroup.com/sainosato/restaurant/buffetterrace.html?active-tab=tab-2\u0026utm_source=prtimes\u0026utm_medium=referral\u0026utm_campaign=sainosato_autumn_gastronomy_2026\u0026utm_id=20260814\u0026utm_content=dinner_buffet#foodfair17\"\u003e 公式サイト\u003c/a\u003e\u003cbr\u003e\u003c/div\u003e\r\n\r\n\u003ciframe src=\"https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3277.420988937689!2d138.0497977!3d34.770175699999996!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x601af82eefd9c817%3A0xafe70c9c36b620a!2z44Gk44G-5oGL44Oq44K-44O844OIIOW9qeOBrumDtw!5e0!3m2!1sja!2sjp!4v1788310385537!5m2!1sja!2sjp\" width=\"600\" height=\"450\" style=\"border:0;\" allowfullscreen=\"\" loading=\"lazy\" referrerpolicy=\"strict-origin-when-cross-origin\"\u003e\u003c/iframe\u003e\r\n\r\n\r\n※記事作成をタイムリーに、かつクオリティ向上をめざして開発した独自AIを、編集部の監修のもと使用しております。\u003cbr\u003e\r\n※この記事は2026年8月時点での情報を基に作成しています。\u003cbr\u003e\r\n※施設・店舗情報は公式サイトおよびGoogleマップの情報を基に作成しています。\u003cbr\u003e\r\n","prFlag":false,"updatedAt":"2026-09-03T07:08:29.055+09:00","publishedAt":"2026-09-03T07:00:00.000+09:00","thumbnailImageUrl":"https://image.loco.kufu.jp/article/1250x_856e716d-0fcd-4f53-840c-53d1faa95a0a.jpg","posterNickname":"","editorName":"くふうロコしずおか編集部","mediaName":"くふうロコしずおか","newsType":"article"},{"id":6027,"title":"絶景すぎる！【熱海】秋限定 “至福のパフェ” が反則級のウマさ♡海を一望できる名店カフェで絶対食べたい\"極上スイーツ\"2選","content":"こんにちは、くふうロコしずおか編集部です。\u003cbr\u003e\r\n\r\n熱海のホテルニューアカオにある絶景カフェ「Restaurant ＆ Sweets 花の妖精」から、秋の味覚を贅沢に使った限定パフェ2種が2026年9月1日（火）より登場。\u003cbr\u003e\r\n相模灘を一望する抜群のロケーションで、地元素材と旬の美味しさが詰まった特別なスイーツを満喫できますよ♪\u003cbr\u003e\r\n\r\n\r\n##かぼちゃと栗が織りなす秋のハーモニー\r\n![155073-44-c904febc1a57a22b871eabd869a44fb8-697x465.jpg](https://image.loco.kufu.jp/article/1250x_d184b423-a4db-4352-8166-79a14f3a9936.jpg)\r\n\r\n秋に甘みが増す「かぼちゃ」と「栗」を主役に、静岡抹茶や丹那ヨーグルトなど地元の厳選素材を合わせた「旬の味わい、かぼちゃと栗のモンブランパフェ ～秋の味覚の彩り～」。\u003cbr\u003e\r\n渋皮付きマロンのコクやかぼちゃクリームのやさしい甘みに、抹茶の苦みやヨーグルトの酸味が心地よいアクセントになっています。食べ進めるごとに変わる風味がたまりません！\u003cbr\u003e\r\n\r\n【提供期間】2026年9月1日（火）～10月15日（木）\u003cbr\u003e\r\n\r\n\r\n##シャインマスカットと巨峰の贅沢競演\r\n![155073-44-24a01b4e7f753e0c27eb096f83e625c2-697x465.jpg](https://image.loco.kufu.jp/article/1250x_22aa9180-2162-4c92-9310-040f9bfe71f3.jpg)\r\n\r\n「シャインマスカットと巨峰のパフェ ～爽やかな甘みと濃厚な香りのアルモニ～」は、みずみずしい2種類のぶどうを贅沢に使用した一品です。静岡産紅茶のシフォンケーキやムースの華やかな香り、伊豆赤ワインとぶどうのスパイスゼリーの深み、マスカルポーネムースの軽やかなコクが、フレッシュなぶどうの甘みを引き立てます。\u003cbr\u003e\r\n\r\n【提供期間】2026年9月1日（火）～11月30日（月）\u003cbr\u003e\r\n\r\n\r\n##相模灘を望む最高のロケーションで至福のひとときを\r\n![155073-44-c0c04013c6c1967cc207f76654b0232a-3900x2600.jpg](https://image.loco.kufu.jp/article/1250x_1cea792d-d8d7-4c40-81ab-710a13f9bbc6.jpg)\r\n\r\n店内は錦ヶ浦の絶景を眼下に望むクラシカルで落ち着いた空間です。大きな窓から広がる海と空のパノラマを眺めながら、秋限定の極上スイーツを楽しんでみてはいかがでしょうか♪\u003cbr\u003e\r\n\r\n\r\n\u003cdiv class=\"facility_information\"\u003e\r\n\u003cb\u003e■Restaurant ＆ Sweets 花の妖精\u003c/b\u003e\u003cbr\u003e\r\n住所：静岡県熱海市熱海1993-65\u003cbr\u003e\r\n営業時間：ティータイム：10:00～17:00（L.O. 16:00）\u003cbr\u003e\r\n　　　　　ランチタイム：11:00～15:00（L.O. 15:00）\u003cbr\u003e\r\n定休日：水曜（祝祭日の場合は営業）\u003cbr\u003e\r\n\u003ca href=\"https://www.instagram.com/cafe_yousei\"\u003e公式Instagram\u003c/a\u003e\u003cbr\u003e\r\n\u003ca href=\"https://www.tablecheck.com/ja/shops/hotel-new-akao-flower/reserve\"\u003eオンライン予約\u003c/a\u003e\u003cbr\u003e\u003c/div\u003e\r\n\r\n\u003ciframe src=\"https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3264.8946711010262!2d139.0797509!3d35.0843644!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x6019be56523585c7%3A0x99fab56020d1ad3a!2zUmVzdGF1cmFudCAmIFN3ZWV0cyDoirHjga7lppbnsr4!5e0!3m2!1sja!2sjp!4v1788311265241!5m2!1sja!2sjp\" width=\"600\" height=\"450\" style=\"border:0;\" allowfullscreen=\"\" loading=\"lazy\" referrerpolicy=\"strict-origin-when-cross-origin\"\u003e\u003c/iframe\u003e\r\n\r\n\r\n※記事作成をタイムリーに、かつクオリティ向上をめざして開発した独自AIを、編集部の監修のもと使用しております。\u003cbr\u003e\r\n※この記事は2026年8月時点での情報を基に作成しています。\u003cbr\u003e\r\n※施設・店舗情報は公式サイトおよびGoogleマップの情報を基に作成しています。\u003cbr\u003e\r\n","prFlag":false,"updatedAt":"2026-09-03T07:05:17.428+09:00","publishedAt":"2026-09-03T07:00:00.000+09:00","thumbnailImageUrl":"https://image.loco.kufu.jp/article/1250x_767ffbf8-dee9-415f-993a-d5c0a16e3081.jpg","posterNickname":"","editorName":"くふうロコしずおか編集部","mediaName":"くふうロコしずおか","newsType":"article"},{"id":6015,"title":"昼も夜も550円って神！【ほっともっと】ガッツリお肉の新シリーズ「550ランチ」3種登場！「太っ腹すぎる（泣）」「毎日通う♪」","content":"こんにちは、くふうロコしずおか編集部です。\u003cbr\u003e\r\n\r\nお持ち帰り弁当でおなじみの「Hotto Motto（ほっともっと）」から、お手頃価格で大満足の「550（ゴーゴー）ランチ」シリーズが登場します。\u003cbr\u003e\r\n\r\n\r\n##税込550円でお腹いっぱいに！\r\n![54093-1617-2ad1d2f2a3868557eac8423a64b4b82d-1097x1457.jpg](https://image.loco.kufu.jp/article/1250x_93b39c84-c53d-47a9-936a-5e08c453db5a.jpg)\r\n\r\n2026年9月1日（火）から新登場する「550ランチ」シリーズは、ボリュームも美味しさも妥協なしのお得ランチです！\u003cbr\u003e\r\n昼間だけでなく全時間帯で買えるので、お昼ごはんにはもちろん、夕食や遅めの食事にも大活躍してくれますよ♪\u003cbr\u003e\r\n\r\n\r\n##気になるラインアップは全3種類\r\nメニューはごはんが進むお肉系がズラリ！\u003cbr\u003e\r\n甘辛い味付けで食欲をそそる「牛焼肉得弁ランチ」、しょうがの香り豊かな「しょうが焼き得弁ランチ」、濃厚ソースで味わう「とりかつ得弁ランチ」の3商品です。どれも550円（税込）とお手頃価格で楽しめます。\u003cbr\u003e\r\n\r\n![54093-1617-7012a740e4be5193487240290b49a326-2605x1549.jpg](https://image.loco.kufu.jp/article/1250x_d8cb0e58-14dd-43e6-8a8d-e403f63a0db1.jpg)\r\n\r\n![54093-1617-5db001586465c339acdc429a51876412-2605x1553.jpg](https://image.loco.kufu.jp/article/1250x_a828414a-0837-49fe-8bd4-6a9b102718aa.jpg)\r\n\r\n![54093-1617-545fdaeba45f7511e4918808572b66af-2605x1525.jpg](https://image.loco.kufu.jp/article/1250x_658d2ecc-faff-465f-8756-a28b5ca8f0d6.jpg)\r\n\r\n\r\n##9月1日（火）から全国で発売スタート\r\n「550ランチ」シリーズは、2026年9月1日（火）より全国の店舗で販売がスタートします。\r\nネット注文も可能なので、ぜひお得な美味しさを味わってみてくださいね。ネット注文限定でご利用可能なアプリクーポンも配信中です。\u003cbr\u003e\r\n\r\n\u003csmall\u003e※一部店舗では商品内容が異なる場合がございます\u003c/small\u003e\r\n\r\n\u003cbr\u003e\r\n[▶ほっともっと 公式サイトはこちら](https://www.hottomotto.com/)\u003cbr\u003e\r\n\r\n[▶ネット注文](https://www.hottomotto.com/netorder/)\u003cbr\u003e\r\n\r\n\u003cbr\u003e\r\n※記事作成をタイムリーに、かつクオリティ向上をめざして開発した独自AIを、編集部の監修のもと使用しております。\u003cbr\u003e\r\n※この記事は2026年8月時点での情報を基に作成しています。\u003cbr\u003e\r\n※施設・店舗情報は公式サイトおよびGoogleマップの情報を基に作成しています。\u003cbr\u003e\r\n","prFlag":false,"updatedAt":"2026-09-01T16:39:05.318+09:00","publishedAt":"2026-09-02T06:00:00.000+09:00","thumbnailImageUrl":"https://image.loco.kufu.jp/article/1250x_a09596b9-cceb-4808-9758-29f502cb9e10.jpg","posterNickname":"","editorName":"くふうロコしずおか編集部","mediaName":"くふうロコしずおか","newsType":"article"},{"id":6022,"title":"完売続出の予感…！【ファミマとコラボ祭】史上最多15社と超豪華コラボ「あのお菓子にあの調味料が！？」夢の限定グルメ全18種","content":"こんにちは、くふうロコしずおか編集部です。\u003cbr\u003e\r\n\r\n全国のファミリーマートで、創立45周年を記念した大注目のキャンペーン「ファミマとコラボ祭」が2026年9月1日（火）からスタート！\u003cbr\u003e\r\n今回の企画はなんとファミマ史上最多となる全15社とタッグを組み、誰もが知っている有名商品の “あの味” を再現した全18種類の商品が登場。注目のラインアップから一部をご紹介します。\u003cbr\u003e\r\n\r\n\r\n##ガッツリ食べたい！絶品コラボフード\r\n![46210-2483-ce7aaffb820aa7cea29a7bcfdb0fe56e-1200x800.jpg](https://image.loco.kufu.jp/article/1250x_c1bede95-0913-4dba-82db-bf951f7aa6d6.jpg)\r\n\r\nガッツリお腹を満たしたい日におすすめなのが、名物商品同士の夢の競演です。\u003cbr\u003e\r\nエバラ焼肉のたれ「黄金の味」の甘みとコクを再現した「エバラ監修 ファミチキ（焼肉のたれ味）」や、出汁とジューシーなおあげの旨味が詰まった「日清のどん兵衛 どんぎつねむすび」が登場します！\u003cbr\u003e\r\n\r\n![46210-2483-97cbc2669d82b485a6f69f2e79401c96-1200x800.jpg](https://image.loco.kufu.jp/article/1250x_11a0f8b8-b4e4-4044-aca7-c566de08b2c8.jpg)\r\n\r\nさらに9月8日（火）からはMizkanの「味ぽん」とコラボした「ファミから（味ぽん味）」や、ペヤングやきそばをイメージした「生ペヤングソースやきそば」も仲間入りしますよ♪\u003cbr\u003e\r\n\r\n![46210-2483-6fe65d6cfec55aa312aca25df78bf9d2-1200x800.jpg](https://image.loco.kufu.jp/article/1250x_3b8fa642-a3ac-456e-a118-8e2850818a98.jpg)\r\n\r\n![46210-2483-6a7e66cebc004ba9794f1f10036f6ee1-1200x800.jpg](https://image.loco.kufu.jp/article/1250x_589f1f6a-8db8-46e0-a6ef-682a7de66d1e.jpg)\r\n\r\n\r\n##スイーツ＆パンも見逃せない\r\n食後のデザートやカフェタイムにぴったりな限定スイーツも目白押しです！\u003cbr\u003e\r\nロッテ「クランキー」のサクサク食感を再現した「クランキー＆ホイップサンド」や、贅沢な3層仕立ての「ゴディバ監修 オペラチョコレートフラッペ」がラインアップ◎\u003cbr\u003e\r\n\r\n![46210-2483-20de3cfdceaeb8f1f0d464345bad6796-1200x800.jpg](https://image.loco.kufu.jp/article/1250x_457cde67-3cde-4c89-adab-bcbe4b95edcc.jpg)\r\n\r\n本家の約20倍の重量感を誇る「パイの実みたいなデニッシュ」など、ワクワクする商品ばかりです！\u003cbr\u003e\r\n\r\n![46210-2483-2e4aaffc8ba758eb473cb9739bd944d1-1200x800.jpg](https://image.loco.kufu.jp/article/1250x_231cf3f8-6d8c-4e29-b88b-1f56b081840e.jpg)\r\n\r\n9月8日（火）からは森永製菓とコラボした「冷やして食べる　ふんわりホットケーキ風サンド」や、チロルチョコとコラボした「チロルチョコ（ファミマ・ザ・メロンパン風味）」なども登場します。\u003cbr\u003e\r\n\r\n![46210-2483-c98fd5ef14685a6b84ef60d6572fa51d-1200x800.jpg](https://image.loco.kufu.jp/article/1250x_6b24fcdf-868b-4c4f-957e-e5238baaad72.jpg)\r\n\r\n\r\n##お近くのファミマへ急ごう！\r\n今回ご紹介した商品のほかにも、満足感たっぷりのフードやドリンクが続々と店頭に並びます！\u003cbr\u003e\r\n人気商品は数量限定のものもありますので、気になるアイテムを見つけた方はぜひお早めにお近くのファミリーマートへ足を運んでみてくださいね。\u003cbr\u003e\r\n\r\n\r\n[▶ファミリーマート公式サイトはこちら](https://www.family.co.jp/)\u003cbr\u003e\r\n\r\n\r\n\u003cbr\u003e\r\n※記事作成をタイムリーに、かつクオリティ向上をめざして開発した独自AIを、編集部の監修のもと使用しております。\u003cbr\u003e\r\n※この記事は2026年8月時点での情報を基に作成しています。\u003cbr\u003e\r\n※施設・店舗情報は公式サイトおよびGoogleマップの情報を基に作成しています。\u003cbr\u003e\r\n","prFlag":false,"updatedAt":"2026-08-31T14:52:11.903+09:00","publishedAt":"2026-09-01T06:00:00.000+09:00","thumbnailImageUrl":"https://image.loco.kufu.jp/article/1250x_20bbf5d0-7521-41d0-8b12-19f48824bf7f.jpg","posterNickname":"","editorName":"くふうロコしずおか編集部","mediaName":"くふうロコしずおか","newsType":"article"},{"id":6016,"title":"初開催の北陸物産展がヤバい！【松坂屋静岡店】7日間限定の絶品肉弁当がウマすぎる（泣）今行かなきゃ一生後悔","content":"こんにちは、くふうロコしずおか編集部です。\u003cbr\u003e\r\n\r\n松坂屋静岡店にて、福井・石川・富山・新潟の魅力を一堂に集めた「北陸4県物産展」が初開催されます。\u003cbr\u003e\r\n食通も注目の絶品グルメから匠の技が光る逸品まで、36の名店が勢ぞろいする注目のイベントです！\u003cbr\u003e\r\n\r\n![25003-3898-831a06f1c3d7ea3312b194b502557051-1500x960.jpg](https://image.loco.kufu.jp/article/1250x_dc84a0c1-ca46-414d-a47e-6500b87821db.jpg)\r\n\r\n\r\n##絶品ご当地グルメ＆銘菓がズラリ！\r\n会場には、北陸の味覚を堪能できる話題のお店が集結します♪\r\n福井の「ミート＆デリカささき」による若狭牛もも肉ステーキ重や「一乃松」の焼鯖寿しをはじめ、新潟の「ほるもん番鳥」極上カルビ焼しゃぶ重など、贅沢なお弁当が登場。\u003cbr\u003e\r\n\r\n![25003-3898-c6302a70f5468c5e4ce081520b66ca90-2880x1920.jpg](https://image.loco.kufu.jp/article/1250x_ec224d2f-cd7d-4be8-aeba-b4eced955a2b.jpg)\r\n\r\n![25003-3898-1ccb25e8e7bf0d0ce6dffd20d5b0f0cb-3900x2925.jpg](https://image.loco.kufu.jp/article/1250x_63fffa2b-3827-45b6-ac09-a1a6266bf3c0.jpg)\r\n\r\nさらに金沢銘菓として親しまれる石川の「紫舟小出」による「ふくさ」の実演販売や、富山のほたるいか沖漬け、新潟の酒蔵が誇る日本酒など、お酒のお供やお土産にぴったりな食の魅力が満載です！\u003cbr\u003e\r\n\r\n![25003-3898-772e7911a9b507d5521700a08a43324d-3900x2600.jpg](https://image.loco.kufu.jp/article/1250x_a11635d7-9d70-4a83-8596-83cae74b6f0b.jpg)\r\n\r\n![25003-3898-85eb89f96308f8f091643c1ca632c3d2-2480x1657.jpg](https://image.loco.kufu.jp/article/1250x_ae490e1a-41a2-46c5-873a-9b8f698efc60.jpg)\r\n\r\n![25003-3898-1d39b374ba26756eb38780a358b01fb6-1920x1280.jpg](https://image.loco.kufu.jp/article/1250x_6f2e2165-8e0b-4a89-a6f4-85d44d6792a9.jpg)\r\n\r\n\r\n##職人の技が光る伝統工芸品も集結\r\nグルメだけでなく、北陸の上質な手仕事に触れられるのも魅力のひとつです。\u003cbr\u003e\r\n加賀友禅の美しい着物や牛首紬、輪島塗の漆器など、北陸が世界に誇る伝統工芸品が並びます。職人たちの丁寧な技術と美意識を感じられる作品を間近で楽しめますよ。\u003cbr\u003e\r\n\r\n![25003-3898-8cb319106c970c5a81fcbd27f5b64d86-3900x3275.jpg](https://image.loco.kufu.jp/article/1250x_bd21b8e2-a1a1-42fb-b8fc-5e3b577c0035.jpg)\r\n\r\n\r\n##9月2日（水）から7日間の期間限定で開催\r\n北陸の食文化と伝統工芸を一度に楽しめる特別な7日間です。ぜひこの機会に、北陸ならではの豊かな魅力を味わいに、松坂屋静岡店を訪れてみてくださいね。\u003cbr\u003e\r\n\r\n\r\n\u003cdiv class=\"facility_information\"\u003e\r\n\u003cb\u003e■北陸4県物産展\u003c/b\u003e\u003cbr\u003e\r\n【開催期間】2026年9月2日（水）～8日（火）\u003cbr\u003e\r\n【開催時間】10:00～19:00 ※最終日は17:00閉場\u003cbr\u003e\r\n【開催場所】松坂屋静岡店 本館8階大催事場\u003cbr\u003e\r\n静岡県静岡市葵区御幸町10-2\u003cbr\u003e\r\n\u003ca href=\"https://www.matsuzakaya.co.jp/shizuoka/topics/2609_hokurikufair.html\"\u003e公式サイト\u003c/a\u003e\u003cbr\u003e\u003c/div\u003e\r\n\r\n\u003ciframe src=\"https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3269.335331218311!2d138.38798079999998!3d34.9732644!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x601a49f770bf682f%3A0xf6259971446066c2!2z5p2-5Z2C5bGL6Z2Z5bKh5bqX!5e0!3m2!1sja!2sjp!4v1779323888558!5m2!1sja!2sjp\" width=\"600\" height=\"450\" style=\"border:0;\" allowfullscreen=\"\" loading=\"lazy\" referrerpolicy=\"no-referrer-when-downgrade\"\u003e\u003c/iframe\u003e\r\n\r\n\r\n※記事作成をタイムリーに、かつクオリティ向上をめざして開発した独自AIを、編集部の監修のもと使用しております。\u003cbr\u003e\r\n※この記事は2026年8月時点での情報を基に作成しています。\u003cbr\u003e\r\n※施設・店舗情報は公式サイトおよびGoogleマップの情報を基に作成しています。\u003cbr\u003e\r\n","prFlag":false,"updatedAt":"2026-08-31T19:45:44.802+09:00","publishedAt":"2026-09-01T06:00:00.000+09:00","thumbnailImageUrl":"https://image.loco.kufu.jp/article/1250x_2a588e10-46c6-425f-98bf-986e186f68f9.jpg","posterNickname":"","editorName":"くふうロコしずおか編集部","mediaName":"くふうロコしずおか","newsType":"article"},{"id":6009,"title":"熱海の映えスポットで妖精に会える？！【アカオフォレスト】絶景＆限定スイーツで秋満喫フルコース「素敵すぎて一生いられる…」","content":"こんにちは、くふうロコしずおか編集部です。\u003cbr\u003e\r\n\r\n静岡県熱海市にある「ACAO FOREST（アカオフォレスト）」で、2026年9月1日（火）から10月31日（土）までの期間、秋の彩りに包まれるイベント「ACAO FOREST 2026 - Flower Autumn -」が開催されます。\u003cbr\u003e\r\n絶景の丘で秋の花々や限定グルメ、体験コンテンツなど盛りだくさんの内容で秋の散策を楽しめますよ♪\u003cbr\u003e\r\n\r\n\r\n##秋を彩る美しい花々と映えフォトスポット\r\n![76648-192-d01aed6746e8397c78f305f0a650a771-2000x1098.jpg](https://image.loco.kufu.jp/article/1250x_272d9eb4-bbf1-4a8a-aef8-116272ec205c.jpg)\r\n\r\n園内では、バラやサルビア、風に揺れるピンクミューリー、パンパスグラスといった秋ならではの花々が見頃を迎えます。\u003cbr\u003e\r\n\r\n![76648-192-421468abcf5b4775beafaa24ffcaf173-3000x2000.jpg](https://image.loco.kufu.jp/article/1250x_91fc8f24-0bf1-48ba-afd3-2cef0c55dac8.jpg)\r\n\r\nさらに、深みのある秋色の花や木の実、紅葉した葉を取り入れた季節限定のフォトスポットが園内3か所に登場。絶景とともに素敵な一枚を撮影できます♪\u003cbr\u003e\r\n\r\n![76648-192-3ec1c773f4058271fd234e8ffa7005f0-1800x2700.jpg](https://image.loco.kufu.jp/article/1250x_938ffb84-de05-4281-9164-1ee570c99190.jpg)\r\n\u003csmall\u003e※画像は過去開催時の装飾です。\u003c/small\u003e\r\n\r\n\r\n##限定の秋グルメ＆ワークショップ\r\nカフェやレストランでは、かぼちゃやぶどう、ベリーなどを使った限定メニューが登場します。「CODA ROSSA」のホワイトシチューや「COEDA HOUSE」のパフェ、「nagisArt café」のタルトなど目移りしそうなスイーツ＆料理が楽しめます。\u003cbr\u003e\r\n\r\n![76648-192-79cc5687ad3809960daaa30f233fb620-3508x2339.jpg](https://image.loco.kufu.jp/article/1250x_e69893a3-d636-4988-9288-124cb7e156e6.jpg)\r\n\r\nまた「cokage」では、金木犀の香水作りやクラフト体験などのワークショップも開催されます。\u003cbr\u003e\r\n\r\n![76648-192-22904f7e34b23597de70ac57ef074bb4-3508x2339.jpg](https://image.loco.kufu.jp/article/1250x_8777790d-ea7a-4d89-aebd-339cdae8a34e.jpg)\r\n\r\n\r\n##妖精探しやSNSキャンペーンも開催♪\r\n園内に暮らす小さな妖精「ノーム」の落とし物を探す体験型イベント「ノームの落とし物探し」を開催。ヒントを頼りに散策しながら楽しめます。\r\nまた、オリジナルギフトが当たるフォトキャンペーンや、ハロウィン仮装をした愛犬と参加できるコスプレキャンペーンも同時開催されます！\u003cbr\u003e\r\n\r\n![76648-192-0daab76417c43d611c906cd6d77772c1-3900x2925.jpg](https://image.loco.kufu.jp/article/1250x_4f7def32-25dd-4e3b-9ccd-527450cfb04e.jpg)\r\n\u003csmall\u003e※画像は「RAINY GARDEN」実施時のノーム装飾です。\u003c/small\u003e\r\n\r\n心地いい秋の風を感じながら、ACAO FORESTで思い出に残る特別なひとときを過ごしてみてはいかがでしょうか。\u003cbr\u003e\r\n\r\n\r\n\u003cdiv class=\"facility_information\"\u003e\r\n\u003cb\u003e■ACAO FOREST 2026 - Flower Autumn -\u003c/b\u003e\u003cbr\u003e\r\n【開催期間】2026年9月1日（火）～10月31日（土）\u003cbr\u003e\r\n【営業時間】9:00～17:00（16:00最終入園）\u003cbr\u003e\r\n【開催場所】ACAO FOREST（アカオフォレスト）\u003cbr\u003e\r\n静岡県熱海市上多賀1027-8\u003cbr\u003e\r\n\u003ca href=\"https://acao.jp/\"\u003e公式サイト\u003c/a\u003e\u003cbr\u003e\u003c/div\u003e\r\n\r\n\u003ciframe src=\"https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3265.1791531727613!2d139.0713372!3d35.0772562!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x6019be51f4791193%3A0xe7f4ed719b790999!2sACAO%20FOREST!5e0!3m2!1sja!2sjp!4v1787817961375!5m2!1sja!2sjp\" width=\"600\" height=\"450\" style=\"border:0;\" allowfullscreen=\"\" loading=\"lazy\" referrerpolicy=\"strict-origin-when-cross-origin\"\u003e\u003c/iframe\u003e\r\n\r\n※記事作成をタイムリーに、かつクオリティ向上をめざして開発した独自AIを、編集部の監修のもと使用しております。\u003cbr\u003e\r\n※この記事は2026年8月時点での情報を基に作成しています。\u003cbr\u003e\r\n※施設・店舗情報は公式サイトおよびGoogleマップの情報を基に作成しています。\u003cbr\u003e\r\n","prFlag":false,"updatedAt":"2026-08-28T22:34:02.564+09:00","publishedAt":"2026-08-31T06:00:00.000+09:00","thumbnailImageUrl":"https://image.loco.kufu.jp/article/1250x_f45b155f-1296-490e-a9c9-febe7e221c73.jpg","posterNickname":"","editorName":"くふうロコしずおか編集部","mediaName":"くふうロコしずおか","newsType":"article"},{"id":6008,"title":"衝撃！生ビール込み飲み放題が300円！？「餃子のかっちゃん」静岡＆浜松店で9月限定の神コスパ祭りがヤバすぎる","content":"こんにちは、くふうロコしずおか編集部です。\u003cbr\u003e\r\n\r\nこだわり餃子と圧倒的なコスパで人気の居酒屋「肉汁製作所 餃子のかっちゃん」の静岡店と浜松店にて、大反響の特大キャンペーンが9月も続行開催されることになりました♪\u003cbr\u003e\r\nなんと、生ビール込みの飲み放題が驚愕の300円（税込330円）で楽しめちゃいます。\u003cbr\u003e\r\n名物の肉汁あふれる熱々「かっちゃん餃子」と一緒に、心ゆくまでお酒を堪能するチャンスですよ！\u003cbr\u003e\r\n\r\n\r\n##飲み放題が衝撃の300円！\r\n![176111-67-dcaa5029120f083a3a47ad836ce9acd8-1536x1024.jpg](https://image.loco.kufu.jp/article/1250x_02a018fa-c09e-4a4d-8ef9-347a91c34c7b.jpg)\r\n\r\n今回開催されるキャンペーンは、生ビールを含んだ飲み放題が300円（税込330円）という衝撃の超絶コスパです！\u003cbr\u003e\r\n利用条件は一人あたりお通し代が別途かかることと、お料理を3品以上オーダーすること。他のクーポンや割引との併用はできませんが、この価格なら大満足間違いなしですね♪\u003cbr\u003e\r\n\r\n\r\n##各店舗の開催日程をチェック！\r\n![176111-67-06af18b1067d1baaad9680f8f3f7fd18-2048x1585.jpg](https://image.loco.kufu.jp/article/1250x_779eeec5-06ff-4faa-ac55-b7b9e54a40de.jpg)\r\n\r\n開催期間は2026年9月限定の「日曜日～木曜日」となります。\u003cbr\u003e\r\nここで注意したいのがシルバーウィーク期間。浜松店は9月13日（日）～17日（木）や連休期間中の日～木曜日もバッチリ対象となりますが、静岡店は9月19日（土）～23日（水）の期間が対象外となります。お出かけの際は日程をしっかりチェックしておきましょう。\u003cbr\u003e\r\n\r\n秋の夜長は、お得な飲み放題と熱々餃子で最高の乾杯を楽しんでみてくださいね！\u003cbr\u003e\r\n\r\n\u003ca href=\"https://gyozanokacchan.com/\"\u003e公式サイト\u003c/a\u003e\u003cbr\u003e\u003c/div\u003e\r\n\r\n\u003cdiv class=\"facility_information\"\u003e\r\n\u003cb\u003e■餃子のかっちゃん 静岡店\u003c/b\u003e\u003cbr\u003e\r\n住所：静岡県静岡市葵区紺屋町7-8 第三ヒダビル\u003cbr\u003e\r\n営業時間：月～木 15:00～翌1:00 ／ 金・土・祝前日 15:00～翌3:00 ／ 日・祝日 15:00～翌0:00\u003cbr\u003e\r\n\r\n\u003ciframe src=\"https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3269.332098129121!2d138.38128008885496!3d34.9733454!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x601a49006120cfdf%3A0x71aa73d4db6e42c2!2z6aSD5a2Q44Gu44GL44Gj44Gh44KD44KTIOmdmeWyoeW6lw!5e0!3m2!1sja!2sjp!4v1787813008935!5m2!1sja!2sjp\" width=\"600\" height=\"450\" style=\"border:0;\" allowfullscreen=\"\" loading=\"lazy\" referrerpolicy=\"strict-origin-when-cross-origin\"\u003e\u003c/iframe\u003e\r\n\r\n\r\n\u003cbr\u003e\r\n\u003cb\u003e■餃子のかっちゃん 浜松店\u003c/b\u003e\u003cbr\u003e\r\n住所：静岡県浜松市中央区鍛治町503 松菱通りB-2ビル 1階\u003cbr\u003e\r\n営業時間：月～木 15:00～翌1:00 ／ 金・祝前日 15:00～翌3:00 ／土 12:00～翌3:00／ 日・祝日 12:00～翌1:00\u003cbr\u003e\r\n\r\n\u003ciframe src=\"https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d1788.4386441252811!2d137.73101101565263!3d34.70490583230835!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x601adf00402b11d7%3A0x7c2b15a34b68528a!2z6aSD5a2Q44Gu44GL44Gj44Gh44KD44KTIOa1nOadvuW6lw!5e0!3m2!1sja!2sjp!4v1787812825091!5m2!1sja!2sjp\" width=\"600\" height=\"450\" style=\"border:0;\" allowfullscreen=\"\" loading=\"lazy\" referrerpolicy=\"strict-origin-when-cross-origin\"\u003e\u003c/iframe\u003e\r\n\r\n\r\n※記事作成をタイムリーに、かつクオリティ向上をめざして開発した独自AIを、編集部の監修のもと使用しております。\u003cbr\u003e\r\n※この記事は2026年8月時点での情報を基に作成しています。\u003cbr\u003e\r\n※施設・店舗情報は公式サイトおよびGoogleマップの情報を基に作成しています。\u003cbr\u003e\r\n","prFlag":false,"updatedAt":"2026-08-28T22:33:11.855+09:00","publishedAt":"2026-08-30T06:00:00.000+09:00","thumbnailImageUrl":"https://image.loco.kufu.jp/article/1250x_870e5f0f-2cfb-4c93-b9bb-0cf59e2c9b42.jpg","posterNickname":"","editorName":"くふうロコしずおか編集部","mediaName":"くふうロコしずおか","newsType":"article"},{"id":3467,"title":"まさかのケンタッキー超え！？中丸くんも食べた【GKB】300円台は神コスパ「食べる手が止まらん（泣）」「悪魔的」鬼リピ2選","content":"こんにちは、くふうロコしずおか編集部です。\r\n\r\n一週間の終わり、金曜日の夜の晩酌だけを生きがいに日々を乗り切っている、ビール党の筆者です。\r\n\r\n「今夜は絶対に飲むぞ！」と心に決めた仕事帰り、新静岡セノバの地下1階をパトロールしていると、どうしても吸い寄せられてしまう危険なスポットがあるのをご存知ですか？\r\n\r\nそれがこちら、「GKB 御殿場高原ビール」です。\r\n\r\n![IMG_5675.jpg](https://image.loco.kufu.jp/article/1250x_3b689588-fe38-4a84-92f7-d9daa707ac5d.jpg)\r\n\r\n美味しいクラフトビールがずらっと並んでいるんですが、私がここでおすすめしたいのは、ビール……ではなく、「ビールと相性が良すぎる悪魔の“おつまみ”」なんです。\r\n\r\n今回は、私がついついリピート買いしてしまう、最高のおつまみ2品をご紹介します！\r\n\r\n## 誘惑度100%！中毒性しかない「やみつきポテチ」\r\n![IMG_5681.jpg](https://image.loco.kufu.jp/article/1250x_0c2923f8-c611-4f28-b0dd-bcc4a06eebde.jpg)\r\n\r\nまずご紹介したいのが、お店で揚げている厚切りのポテトチップス「やみつきポテチ（通称やみぽて）」です！\r\n\r\n![サムネイル.jpg](https://image.loco.kufu.jp/article/1250x_3b4f975f-e8d7-48bb-95cf-6959025561a5.jpg)\r\n\r\nこれ、お値段380円とお手頃なんですが、本当に名前の通り「やみつき」になる悪魔的なポテチなんです。\r\n期間限定でバター醤油味などが登場するんですけど、私はブレずにいつもトリュフ塩味」一筋。\r\n\r\n![IMG_5683.jpg](https://image.loco.kufu.jp/article/1250x_c18312ea-f291-49b5-82d3-46e89fd8a620.jpg)\r\n\r\nじゃがいもをそのままスライスして揚げているのがわかる、しっかりとした厚み。スーパーで売ってる袋入りのポテチというよりは、素材の味をしっかりと感じられる「さつまいもチップス」に近い、バリッ！ザクッ！とした強烈な食べ応えです。厚切り派にはたまりません。\r\n\r\n![IMG_5685.jpg](https://image.loco.kufu.jp/article/1250x_e566276f-fb6c-4818-b920-b7147c9b21b1.jpg)\r\n\r\nお店のショーケースに貼られたポップには「中丸くんが食べた！」の文字が。ええ〜いつの間に。私の推しを中丸くんに共有できたなんてうれしい！\r\n\r\n![IMG_5679.jpg](https://image.loco.kufu.jp/article/1250x_b3a87c18-5abc-4eab-91f4-6cb818c2273e.jpg)\r\n\r\nそしてここは専門店だけあってビールの種類も豊富。ビール×ポテチが一緒に並んでるから、絶対に両方買っちゃうんですよね。お店の戦略にまんまとはまっていますが、本望です！\r\n\r\n## まさかのケンタッキー超え！？「ザクザクチキン」\r\n![IMG_5690.jpg](https://image.loco.kufu.jp/article/1250x_be7a68b8-5083-46f9-909d-b1315bd97320.jpg)\r\n\r\n\r\nやみポテを吟味していると視界に飛び込んでくるのが、横にドドンと鎮座するでっかいチキン。\r\n\r\n今日はポテチだけにするって決めてたのに……！つい「あ、これも一つ」と追加してしまうのが、こちらの「ザクザクチキン」です。\r\n\r\n![IMG_5691.jpg](https://image.loco.kufu.jp/article/1250x_b16b4aca-072d-4874-b382-3bd96170e1c1.jpg)\r\n\r\nなんとこのチキン、GKBで作っている「御殿場コシヒカリラガー」というビールと米粉を衣に使用しているそうなんです！\r\n\r\n![IMG_5692.jpg](https://image.loco.kufu.jp/article/1250x_98ea07ef-8256-41a2-81e1-bf94b5483840.jpg)\r\n\r\n見た目からしてすでにザクザクなのが伝わるんですが、一口かぶりつくと……\r\n\r\nザクザクじゃない、ざっっっくざく！！！\r\n\r\n![IMG_5693.jpg](https://image.loco.kufu.jp/article/1250x_cf6d2859-68cb-46f7-bba3-466d9cfe4357.jpg)\r\n\r\n衣のハードなザクザク感を抜けると、中からはジューシーなお肉が登場。\r\nスパイスがガツンと効いた濃いめの大人の味付けで、これまたビールとの相性が抜群。一口食べてはビールを流し込むという無限ループです。\r\n\r\n正直、「ケンタッキー超え！？」と思ってしまうほど。どちらも甲乙つけ難いですが、とにかく最高に美味しいチキンであることは間違いありません。\r\n\r\n## 週末の始まりはセノバから！\r\n![IMG_5680.jpg](https://image.loco.kufu.jp/article/1250x_ecbd7307-e03f-4b99-90eb-f9233fa0781a.jpg)\r\n\r\nトリュフ塩の香る厚切りのザクザクポテトと、スパイスが効いた巨大なザクザクチキン。そしてキンキンに冷えた美味しいビール！これさえあれば、一週間の疲れなんて一瞬で吹き飛びます。\r\n\r\n新静岡セノバに立ち寄った際は、ぜひ地下1階の「GKB 御殿場高原ビール」を覗いてみてください。きっとあなたも、両手に美味しいおつまみとビールを抱えて帰ることになるはずですよ！\r\n\r\n\u003cdiv class=\"facility_information\"\u003e\r\n\u003cb\u003e■GKB 御殿場高原ビール\u003c/b\u003e\u003cbr\u003e\r\n住所：静岡県静岡市葵区鷹匠1丁目1−1 B1F\u003cbr\u003e\r\n電話： 054-266-7354\u003cbr\u003e\r\n営業時間：10:00～20:00　\u003cbr\u003e\r\nInstagram：\u003ca href=\"https://www.instagram.com/gkb_shizu_0624/\"\u003ehttps://www.instagram.com/gkb_shizu_0624/\u003c/a\u003e\u003cbr\u003e\r\n\u003c/div\u003e\r\n\r\n\r\n\u003ciframe src=\"https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3269.2487340609105!2d138.3871834!3d34.9754339!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x601a4b8ffb3a3e9b%3A0x8ba7a691d86e088c!2zR0tCIOW-oeauv-WgtOmrmOWOn-ODk-ODvOODqw!5e0!3m2!1sja!2sjp!4v1788136072098!5m2!1sja!2sjp\" width=\"600\" height=\"450\" style=\"border:0;\" allowfullscreen=\"\" loading=\"lazy\" referrerpolicy=\"strict-origin-when-cross-origin\"\u003e\u003c/iframe\u003e\r\n\r\n※この記事は2026年8月時点での情報を基に作成しています。\u003cbr\u003e\r\n※施設・店舗情報は公式サイトおよびGoogleマップの情報を基に作成しています。","prFlag":false,"updatedAt":"2026-08-31T11:31:28.207+09:00","publishedAt":"2026-08-30T06:00:00.000+09:00","thumbnailImageUrl":"https://image.loco.kufu.jp/article/1250x_8608e47a-7b05-4c11-a863-581d89cfe0a2.jpg","posterNickname":"","editorName":"くふうロコしずおか編集部","mediaName":"くふうロコしずおか","newsType":"article"},{"id":6006,"title":"え、本物じゃないの！？【話題沸騰】サッポロ一番がポーチに♪『オレンジページ』付録が豪華すぎる◎「再現度スゴ…」「今すぐ予約しなきゃ！」","content":"こんにちは、くふうロコしずおか編集部です。\u003cbr\u003e\r\n\r\n生活情報誌『オレンジページ』と国民的ラーメン「サッポロ一番」の大人気コラボ付録に、待望の第3弾が登場します！\u003cbr\u003e\r\n今回は「しょうゆ味」「みそ」「塩」が勢ぞろいした豪華なポーチ3点セットで、発売前から話題沸騰中なんですよ。\u003cbr\u003e\r\n\r\n\r\n##本物そっくり！再現度の高いデザイン♪\r\n![rhQ5LTFCuYTXct7gfbqR.jpg](https://image.loco.kufu.jp/article/1250x_be82b70d-2f9e-41fc-902b-eb1abf6f3842.jpg)\r\n\r\nメインの「サッポロ一番 しょうゆ味 そのままポーチ」は、パッケージのデザインやサイズをほぼ忠実に再現したリアルな作りになっています！\u003cbr\u003e\r\n\r\n![ElkgJFxiYL0efpMwMfnK.jpg](https://image.loco.kufu.jp/article/1250x_07dda267-ea5c-430a-8e15-49e97911fc2e.jpg)\r\n\r\n大きめのスマホがすっぽり納まるサイズ感で、便利なカラビナが付いているのも嬉しいポイント。リュックやバッグの持ち手に取り付ければ、お出かけ先で周囲の視線を集めること間違いなしです。\u003cbr\u003e\r\n \r\n![e0RadOVIrYGUuysNj315.jpg](https://image.loco.kufu.jp/article/1250x_d78ba60a-8b19-483b-b2f8-fb1613f62e91.jpg)\r\n\r\n\r\n##使い勝手抜群！3種のポーチでバッグすっきり◎\r\n小さめサイズの「みそ」「塩」ミニポーチは、リップや手鏡などの身だしなみグッズ、充電コードやティッシュなどの小物整理に大活躍！しかも「みそ」と「塩」のミニポーチは「しょうゆ味」のポーチの中にすっぽり収納できちゃうんです。\u003cbr\u003e\r\n\r\n![Hjm5aHUq6XZ179KM04a1.jpg](https://image.loco.kufu.jp/article/1250x_718326c5-957e-4aed-9c13-00f0f9f3a148.jpg)\r\n\r\nデスク上の文具入れやティータイムグッズの保管など、さまざまなシーンで使えて便利ですよ。\u003cbr\u003e\r\n\r\n![x7KQ9km3EidvvkfSQeYa.jpg](https://image.loco.kufu.jp/article/1250x_5785ca40-3c7f-486b-9afa-55441d94aced.jpg)\r\n\r\nポーチ付きの『オレンジページ9/17号増刊』（特別定価1,360円）は2026年9月2日（水）発売で、全国の書店、ネット書店で予約受付中！気になった方は、ぜひチェックしてみてくださいね。\u003cbr\u003e\r\n\r\n![jBGpWRbRftoh60XoYdVH.jpg](https://image.loco.kufu.jp/article/1250x_ece4c213-524c-4348-b1c9-c7b9fb4572a8.jpg)\r\n\r\n\r\n[▶オレンジページ公式サイトこちら](https://www.orangepage.net/books/2090)\u003cbr\u003e\r\n\r\n\r\n※記事作成をタイムリーに、かつクオリティ向上をめざして開発した独自AIを、編集部の監修のもと使用しております。\u003cbr\u003e\r\n※この記事は2026年8月時点での情報を基に作成しています。\u003cbr\u003e\r\n※施設・店舗情報は公式サイトおよびGoogleマップの情報を基に作成しています。\u003cbr\u003e\r\n","prFlag":false,"updatedAt":"2026-08-28T22:11:11.024+09:00","publishedAt":"2026-08-29T06:00:00.000+09:00","thumbnailImageUrl":"https://image.loco.kufu.jp/article/1250x_33b35189-1913-4c28-a115-ae88809c325a.jpg","posterNickname":"","editorName":"くふうロコしずおか編集部","mediaName":"くふうロコしずおか","newsType":"article"},{"id":5989,"title":"マツコ＆イチローさんも絶賛！爆売れ→ラス1ゲット（泣）【ローソン】「罪深いウマさ」衝撃のご当地限定グルメ3選","content":"こんにちは、くふうロコしずおか公式ライターのこしあんです。\u003cbr\u003e\r\n\r\nローソンでは、2026年8月18日（火）から、地元の名店監修やご当地の味を楽しめる「ご当地うまいもん祭」を開催中！\u003cbr\u003e\r\n全国を8エリアに分け、オリジナルの「からあげクン」や「プレミアムロールケーキ」などを販売。静岡県が対象になっている東海北陸地区では、「ステーキのあさくま」や「風来坊」が監修したメニューをはじめ、全9品が登場しています。\u003cbr\u003e\r\n\r\n今回、気になった3品の実食レポをお届けします！\u003cbr\u003e\r\n\r\n![IMG_4152.jpeg](https://image.loco.kufu.jp/article/1250x_f4ecfcda-f21b-449b-8bf0-405204ee1468.jpeg)\r\n\r\n\r\n##【東海北陸限定】からあげクン ステーキのあさくま監修 コーンスープ味　税込298円\r\n愛知県発祥のステーキハウスチェーン「ステーキのあさくま」監修。静岡県内にもけっこう店舗がありますが、実は一度も行ったことがなく……。サラダバーで味わえるコーンスープがとても人気ということはうっすら知っていました。\u003cbr\u003e\r\nあさくまのコーンスープはレトルトでも販売されていて、『マツコの知らない世界』のコーンスープ特集でも紹介され、その濃厚さを大絶賛！\u003cbr\u003e\r\n愛知県出身のイチローさんも、朝食にあさくまのコーンスープを愛飲しているのだそう。\u003cbr\u003e\r\n\r\nそんな “創業から変わらぬ伝統のあさくまのコーンスープのまろやかでクリーミーな味わい” を再現したからあげクンです。\u003cbr\u003e\r\n\r\n![IMG_4153.jpeg](https://image.loco.kufu.jp/article/1250x_a4d62ec4-ab3c-4a97-be74-f4e318f70109.jpeg)\r\n\r\n早朝に来店したところ、からあげクン、ラス１でした！あぶないあぶない。即行カゴに入れて確保したら、コーンスープの濃厚な香りが買い物中ず～っと漂っていました。\u003cbr\u003e\r\n\r\n今すぐかぶりつきたい気持ちと戦いながら帰宅。ずっといい香り♪\u003cbr\u003e\r\n\r\n![IMG_4156.jpeg](https://image.loco.kufu.jp/article/1250x_bc59a007-8dc4-477b-bb0c-adaa6a761508.jpeg)\r\n\r\nウワサ通り、とうもろこしの味が濃厚ッ！！！\u003cbr\u003e\r\n甘みと旨みとコクがすんごいです。\u003cbr\u003e\r\nからあげなのにコーンスープの味がするので、ちょっと不思議な感覚になるけどおいしい。\u003cbr\u003e\r\n\r\nこれはオリジナルのスープをぜひとも飲んでみたい！！！\u003cbr\u003e\r\n通販サイトで購入できるようなので、さっそく注文しちゃうぜぇ。店舗にも早いうちに行きたいぜぇ。\u003cbr\u003e\r\n\r\n\r\n##【東海北陸限定】ステーキのあさくま監修 プリン風プレミアムロールケーキ　税込248円\r\n![IMG_4155.jpeg](https://image.loco.kufu.jp/article/1250x_43ed355e-4685-4499-bb3a-014f290036b7.jpeg)\r\n\r\nこちらも「ステーキのあさくま」監修。サラダバーで味わえる人気デザートのプリンをイメージしたプレミアムロールケーキです。\u003cbr\u003e\r\n\r\n![IMG_4159.jpeg](https://image.loco.kufu.jp/article/1250x_51867d1c-64dc-4a34-a9c3-eaaa83442625.jpeg)\r\n\r\nなめらかなプリン味のクリームにカラメルがアクセントになっています。甘さ控えめで軽やかで食べやすく、普通に十分おいしいのですが、「もっともっと食べたい食べたい！」というほどではないかも。\u003cbr\u003e\r\nプリンって、あの食感ありきのおいしさだと思っているので、 この商品に限らずですが、“プリン味の何か” ってちょっと物足りなさを感じてしまうのかなぁ。自分は、“プリンはプリンのまま食べたい族” だったんだなぁと再認識しました。\u003cbr\u003e\r\n\r\nこれもあさくまの店舗でプリンとして食べてみたいですね！\u003cbr\u003e\r\n\r\n\r\n##【東海北陸限定】風来坊監修　手羽先唐揚風チキンカツサンド　税込430円\r\n![IMG_4154.jpeg](https://image.loco.kufu.jp/article/1250x_4d9a34d9-5b2a-47f6-8334-bbda40dd84a8.jpeg)\r\n\r\n名古屋を中心に展開する手羽先の有名店「風来坊」監修。手羽先唐揚をイメージしたスパイシーなチキンカツサンドです。静岡には風来坊の店舗がないので、コンビニで味わえるのは嬉しいですね。\u003cbr\u003e\r\n\r\n![IMG_4158.jpeg](https://image.loco.kufu.jp/article/1250x_c00aefd7-b6e0-4b14-b621-95fc57e187f7.jpeg)\r\n\r\nちゃんと手羽先唐揚の味がする！絶妙な甘辛スパイシー具合が食欲をそそります。モリモリいけちゃう。黒コショウとゴマの風味がいいですね。\u003cbr\u003e\r\nレンチンすると柔らかさと風味が増してさらにうんまい♪\u003cbr\u003e\r\n手羽先唐揚は大好きですが、骨があってやや食べづらく、手がベチャベチャになるのが難点だったのですが（それが醍醐味でもありますが）、このサンドイッチならそれも解消。手軽に手羽先唐揚気分が味わえます◎\u003cbr\u003e\r\n\r\n愛知方面に行く機会があれば、風来坊に寄ってみたいです。\u003cbr\u003e\r\n\r\nあぁ、ほかのエリアの商品もぜんぶ食べたいッ……！ローソンさん、罪深い……。\u003cbr\u003e\r\n一瞬で全国を巡れるどこでもドアがほしいです笑\u003cbr\u003e\r\n\r\n\r\n\u003cbr\u003e\r\n[▶ローソン 公式サイト ニュースリリースはこちら]\r\n(https://www.lawson.co.jp/company/news/detail/1530894_2504.html)\u003cbr\u003e\r\n\r\n[▶ローソン 公式サイト ご当地うまいもん祭についてはこちら]\r\n(https://www.lawson.co.jp/lab/campaign/umaimonmatsuri/)\u003cbr\u003e\r\n\r\n\u003cbr\u003e\r\n※この記事は2026年8月時点での情報を基に作成しています。\u003cbr\u003e\r\n","prFlag":false,"updatedAt":"2026-08-28T22:17:52.007+09:00","publishedAt":"2026-08-29T06:00:00.000+09:00","thumbnailImageUrl":"https://image.loco.kufu.jp/article/1250x_7ab24e34-5ed0-4c7a-a101-b10c32abe4c2.jpeg","posterNickname":"","editorName":"こしあん","mediaName":"くふうロコしずおか","newsType":"article"},{"id":6003,"title":"追加料金なしで食べ放題って神！【パンケーキ＆ホイップクリーム】まるで夢の国♡「アレンジ無限大」「背徳感ヤバい…」","content":"こんにちは、くふうロコしずおか編集部です。\u003cbr\u003e\r\n\r\n和洋中の多彩なお料理を楽しめる「ニラックスブッフェ」にて、甘党にはたまらない夢のような特別企画を開催中！\u003cbr\u003e\r\nWEB予約限定で「パンケーキ＆ホイップクリーム」が好きなだけ楽しめる「無限パンケーキ＆ホイップ」コースが期間限定で登場。通常コースの追加料金なしで選べるので、とってもお得ですよ♪\u003cbr\u003e\r\n\r\n\r\n##WEB予約限定のスペシャル企画\r\n![33462-1215-ab36ecaf795892dfb381044e909c0de7-1200x900.jpg](https://image.loco.kufu.jp/article/1250x_56455ce7-b9bd-415c-8def-8c5659ff8246.jpg)\r\n\r\n今回の企画は、2026年8月27日（木）から9月30日（水）までの期間限定開催。LINEなどのWEB予約で「無限パンケーキ＆ホイップ 食べ放題」コースを選択するだけで、通常コース料金のまま『パンケーキ』と『ホイップクリーム』が無料で楽しめちゃいます。\u003cbr\u003e\r\n\r\n\r\n##自分で絞って完成！セルフメイクスタイル\r\n![33462-1215-5d8be44a0c968c00dc5465ea57f4d8ae-1200x900.jpg](https://image.loco.kufu.jp/article/1250x_5afe1b14-3800-418e-b25d-a0b1e1e950e2.jpg)\r\n\r\n「無限パンケーキ＆ホイップ」コースは、パンケーキにご自身でホイップクリームをたっぷりと絞り出すセルフメイクスタイル。\u003cbr\u003e\r\n王道スイーツ系はもちろん、サラダやから揚げを合わせた “お食事系パンケーキ” や、他のスイーツとのアレンジもおすすめ！\u003cbr\u003e\r\n\r\n![33462-1215-480e39f52d1c728760e28df505f4644a-1200x900.jpg](https://image.loco.kufu.jp/article/1250x_ddd0fc25-056a-4fa3-85da-679b6410ae40.jpg)\r\n\r\n![33462-1215-3328d55f700a0af76ac831cf093c89a6-1200x900.jpg](https://image.loco.kufu.jp/article/1250x_aeda43ba-6a30-459a-be58-143198abf120.jpg)\r\n\r\n\r\n##静岡県は「一人鍋しゃぶしゃぶ すうぷ 静岡パルコ」が対象\r\nこちらの限定コースは対象の39店舗にて実施されます。静岡県内では、一人鍋しゃぶしゃぶと台湾グルメが食べ放題の「一人鍋しゃぶしゃぶ すうぷ 静岡パルコ」で楽しめます。\u003cbr\u003e\r\n\r\n![33462-1215-a6feec4e5b5bb4ad71a7cfae9001286b-1200x900.jpg](https://image.loco.kufu.jp/article/1250x_1272f859-a70d-48c1-911d-7e7f92b48830.jpg)\r\n\r\n店舗によっては期間途中で終了する場合もあるそうなので、気になる方はぜひお早めにWEBから予約のうえ、足を運んでみてくださいね！\u003cbr\u003e\r\n\r\n\r\n\u003cdiv class=\"facility_information\"\u003e\r\n\u003cb\u003e■一人鍋しゃぶしゃぶ すうぷ 静岡パルコ\u003c/b\u003e\u003cbr\u003e\r\n住所：静岡県静岡市葵区紺屋町6-7 静岡パルコ2階\u003cbr\u003e\r\n\u003ca href=\"https://www.nilax.jp/store/brand/21\"\u003e公式サイト\u003c/a\u003e\u003cbr\u003e\u003c/div\u003e\r\n\r\n\u003ciframe src=\"https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3269.3476807605775!2d138.386083!3d34.972955!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x601a49d178e294f9%3A0x231c5bee3ae50f74!2z5LiA5Lq66Y2L44GX44KD44G244GX44KD44G2IOOBmeOBhuOBtyDpnZnlsqHjg5Hjg6vjgrM!5e0!3m2!1sja!2sjp!4v1787723729250!5m2!1sja!2sjp\" width=\"600\" height=\"450\" style=\"border:0;\" allowfullscreen=\"\" loading=\"lazy\" referrerpolicy=\"strict-origin-when-cross-origin\"\u003e\u003c/iframe\u003e\r\n\r\n\r\n※記事作成をタイムリーに、かつクオリティ向上をめざして開発した独自AIを、編集部の監修のもと使用しております。\u003cbr\u003e\r\n※この記事は2026年8月時点での情報を基に作成しています。\u003cbr\u003e\r\n※施設・店舗情報は公式サイトおよびGoogleマップの情報を基に作成しています。\u003cbr\u003e\r\n","prFlag":false,"updatedAt":"2026-08-28T22:09:22.102+09:00","publishedAt":"2026-08-29T06:00:00.000+09:00","thumbnailImageUrl":"https://image.loco.kufu.jp/article/1250x_8ffaeac3-a526-4c23-9c5b-4bfb63387523.jpg","posterNickname":"","editorName":"くふうロコしずおか編集部","mediaName":"くふうロコしずおか","newsType":"article"},{"id":5999,"title":"ウソでしょ？！黒毛和牛が500円！3日間限定【創業祭＆焼肉の日】がアツすぎる！静岡県内1店舗だけ（泣）","content":"こんにちは、くふうロコしずおか編集部です。\u003cbr\u003e\r\n\r\n1人1台のロースターでマイペースにお肉を楽しめる「焼肉ライク」が、2026年8月29日（土）に創業8周年を迎えます。これを記念して、8月29日（土）から8月31日（月）までの3日間限定で「焼肉の日＆創業祭」が開催されますよ。\u003cbr\u003e\r\n贅沢な黒毛和牛がお得に味わえるチャンスをお見逃しなく！\u003cbr\u003e\r\n\r\n\r\n##8月29日限定！黒毛和牛赤身が1皿500円\r\n![34691-485-581d3738ba0f7545ff6df4352a3cba9e-1280x720.jpg](https://image.loco.kufu.jp/article/1250x_3605d7dc-9168-42a0-b72a-f3249d95967e.jpg)\r\n\r\n創業日であり「焼肉の日」でもある8月29日（土）は、厳選された「黒毛和牛赤身」の単品が、なんと1日限定の特別価格500円（税込）で販売されます！\u003cbr\u003e\r\nいつものお好きな焼肉セットにワンコインで上質な黒毛和牛をプラスできるなんて、とっても魅力的ですよね。\u003cbr\u003e\r\n\r\n\r\n##8月30日・31日は豪華ごちそうセットが登場\r\n![34691-485-d918a339f1ca5250d8b355bb326d1773-3900x2601.jpg](https://image.loco.kufu.jp/article/1250x_307e3820-8196-4974-b811-c4afb47366d7.jpg)\r\n\r\n続く8月30日（日）と8月31日（月）の2日間は、「焼肉の日ごちそうセット」が1,990円（税込）で登場します！\u003cbr\u003e\r\n黒毛和牛赤身・カルビ・ハラミの3種類の部位を一度に楽しめる大満足の内容です。いろいろなお肉を少しずつ楽しみたい方にぴったりですね。\u003cbr\u003e\r\n\r\n\r\n##ひとり焼肉で自分ごほうびを\r\n![34691-485-c39a0a030cba6143b29ce6ecf789eebf-1950x1300.jpg](https://image.loco.kufu.jp/article/1250x_53ecd5ff-6033-4ffe-9099-94f1348ef4e3.jpg)\r\n\r\n自分のペースで焼き加減を調整しながら、じっくりとお肉を堪能できるのが焼肉ライクの嬉しいところです。\u003cbr\u003e\r\n「焼肉の日＆創業祭」は全国の72店舗で開催され、静岡県内は静岡呉服町店のみとなっています。\u003cbr\u003e\r\n\r\n実施期間はたったの3日間ですので、ぜひこの機会に足を運んで至福の焼肉タイムを過ごしてみてくださいね！\u003cbr\u003e\r\n\r\n\r\n\u003cdiv class=\"facility_information\"\u003e\r\n\u003cb\u003e■焼肉ライク 静岡呉服町店\u003c/b\u003e\u003cbr\u003e\r\n住所：静岡県静岡市葵区紺屋町1-3 岩久本店ビル1F\u003cbr\u003e\r\n営業時間：11：00～23：00（L.O.22：30）\u003cbr\u003e\r\n定休日：無休\u003cbr\u003e\r\n\u003ca href=\"https://www.yakiniku-like.com/\"\u003e公式サイト\u003c/a\u003e\u003cbr\u003e\u003c/div\u003e\r\n\r\n\u003ciframe src=\"https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3269.314383877557!2d138.3849768!3d34.9737892!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x601a49ec567f1feb%3A0xda353edf45cfc18c!2z54S86IKJ44Op44Kk44KvIOmdmeWyoeWRieacjeeUuuW6lw!5e0!3m2!1sja!2sjp!4v1756083015444!5m2!1sja!2sjp\" width=\"600\" height=\"450\" style=\"border:0;\" allowfullscreen=\"\" loading=\"lazy\" referrerpolicy=\"no-referrer-when-downgrade\"\u003e\u003c/iframe\u003e\r\n\r\n\r\n※記事作成をタイムリーに、かつクオリティ向上をめざして開発した独自AIを、編集部の監修のもと使用しております。\u003cbr\u003e\r\n※この記事は2026年8月時点での情報を基に作成しています。\u003cbr\u003e\r\n※施設・店舗情報は公式サイトおよびGoogleマップの情報を基に作成しています。\u003cbr\u003e\r\n","prFlag":false,"updatedAt":"2026-08-26T17:07:12.503+09:00","publishedAt":"2026-08-27T06:00:00.000+09:00","thumbnailImageUrl":"https://image.loco.kufu.jp/article/1250x_58cf7b25-dddf-446f-a9f8-67db3611ebf3.jpg","posterNickname":"","editorName":"くふうロコしずおか編集部","mediaName":"くふうロコしずおか","newsType":"article"},{"id":6000,"title":"それバウムにしちゃうの！？【無印良品】新作バウム4種「新鮮な食感！」「香ばしい♪」みんなで選んだご当地バウムが激アツ","content":"こんにちは、くふうロコしずおか編集部です。\u003cbr\u003e\r\n\r\n無印良品で大人気の不揃いバウムシリーズに、とってもワクワクする新作が登場しました！\u003cbr\u003e\r\nお客さまと店舗スタッフのアイデア＆投票から選ばれた「みんなでつくるバウム」の第2弾として、日本各地の名産品・特産品をイメージした4つのフレーバーが2026年8月26日（水）より期間限定で順次発売されます♪\u003cbr\u003e\r\n\r\n![987-1848-6cee87b765bf1958045fa9a905600512-1434x447.jpg](https://image.loco.kufu.jp/article/1250x_3047ba8d-9fe2-4346-af3c-6cc7030bc74c.jpg)\r\n\r\n\r\n##東日本1位・2位！りんご飴＆焼きとうもろこし\r\n東日本エリアで投票1位に輝いた青森県の「りんご飴」をイメージした「不揃い りんご飴風バウム」は、大粒のパールシュガーをトッピングしてフレッシュで爽やかな甘酸っぱさを表現！\u003cbr\u003e\r\n\r\n![987-1848-36c8d8429823182ea1cfd116239c2bdd-2000x2000.jpg](https://image.loco.kufu.jp/article/1250x_c56602d8-96b6-4b20-90ae-3de5fbc74e1f.jpg)\r\n\r\nそして2位の北海道「焼きとうもろこしバター」をイメージした「不揃い 焼きとうもろこし風バターバウム」は、生地にとうもろこしパウダーや岩塩を使用し、醤油風味のゼリーをかけた甘じょっぱさがたまらない一品です。\u003cbr\u003e\r\n\r\n![987-1848-3ddadafb77bd567c11f40286df36bef4-2000x2000.jpg](https://image.loco.kufu.jp/article/1250x_450541be-c4da-47a7-9f3e-5d7149516cdd.jpg)\r\n\r\n\r\n##西日本1位・2位！サーターアンダギー＆オリーブ塩\r\n西日本エリアで1位を獲得した沖縄県の「黒糖サーターアンダギー」をイメージした「不揃い 黒糖サーターアンダギー風バウム」は、二度焼きすることでサクッとした食感を実現！砕いたかりんとうのトッピングもポイントです♪\u003cbr\u003e\r\n\r\n![987-1848-daf93454b23a543e05edc9bce6525d24-2000x2000.jpg](https://image.loco.kufu.jp/article/1250x_8c000069-38b2-4ccc-b3c9-33195c6820cb.jpg)\r\n\r\n2位の香川県「オリーブ塩」をイメージした「不揃い オリーブ塩バウム」は、オリーブオイルと岩塩入りの生地に甘\r\nいアイシングがかかっていて、トースターで焼いてブラックペッパーを振るアレンジもおすすめですよ。\u003cbr\u003e\r\n\r\n![987-1848-b4714a1b63ae06fd822ab5decb73b1aa-2000x2000.jpg](https://image.loco.kufu.jp/article/1250x_45612ce2-d7bf-4067-bb63-ffa4574bf58b.jpg)\r\n\r\n\r\n##お気に入りの味を見つけてみよう！\r\nどれもこだわりがギュッと詰まった魅力的な味ばかりですね。気になるフレーバーを試して、お気に入りのひとつを見つけてみてはいかがでしょうか。\r\n\r\n\r\n[▶無印良品「みんなでつくるバウム」特集ページはこちら](https://www.muji.com/jp/ja/special-feature/food/baum-vote/)\u003cbr\u003e\r\n\r\n\r\n※記事作成をタイムリーに、かつクオリティ向上をめざして開発した独自AIを、編集部の監修のもと使用しております。\u003cbr\u003e\r\n※この記事は2026年8月時点での情報を基に作成しています。\u003cbr\u003e\r\n※施設・店舗情報は公式サイトおよびGoogleマップの情報を基に作成しています。\u003cbr\u003e\r\n","prFlag":false,"updatedAt":"2026-08-26T17:08:07.182+09:00","publishedAt":"2026-08-27T06:00:00.000+09:00","thumbnailImageUrl":"https://image.loco.kufu.jp/article/1250x_ea962481-9f41-48a8-b113-128df2da8401.jpg","posterNickname":"","editorName":"くふうロコしずおか編集部","mediaName":"くふうロコしずおか","newsType":"article"},{"id":5951,"title":"午前中で即完売も（泣）【創業100余年の老舗】幻の品＆和洋折衷\"進化系スイーツ\"が感動もの『鬼に金棒』秋の和菓子3選","content":"こんにちは、くふうロコしずおか公式ライターの山ちゃんです。\r\n\r\n今回訪ねたのは、静岡市葵区籠上に店を構える老舗「わがし屋なかやま」。お客様が絶えることのない人気店です。\r\n\r\n長年受け継いできたものを大切にしながら、新しい味わいにも挑戦し、季節の趣を映した美しい和菓子の隣には、思わず心が弾むような遊び心のあるお菓子も。\r\n\r\n今回は「わがし屋なかやま」の魅力をご紹介します。\r\n\r\n##「わがし屋なかやま」とは？\r\n\r\n###100余年、静岡の暮らしに寄り添って\r\n![nakayama (6).jpeg](https://image.loco.kufu.jp/article/1250x_2ae2ea10-7e28-40a0-9f28-c47bcc799f14.jpeg)\r\n\r\n創業から100余年という長い歴史を持つ「わがし屋なかやま」。\r\n\r\nおまんじゅう、羊かん、どらやき、カステラなど、日々のお茶の時間にそっと寄り添ってくれるような、親しみのあるお菓子が並んでいます。\r\n\r\nその一方で、季節の生菓子など、特別な日を彩る折々の風情を楽しめるものも。その日の気分やシーンに合わせて選ぶことができます。\r\n\r\n###小さなかごに、好きなものをひとつずつ\r\n店内では、気になるお菓子を小ぶりのかごに入れてレジへ。\r\n\r\n100円台から手に取れるお菓子もあり、老舗の味を気軽に楽しめる価格帯も嬉しいところ。\r\n\r\n自宅でいただくお茶菓子を選ぶのもよし。\r\n\r\n大切な方への手土産を探すのもよし。\r\n\r\n贈る相手の顔を思い浮かべながら選ぶのも、また楽しいものです。\r\n\r\n\r\n##秋の訪れを感じる、栗のお菓子\r\n\r\n今回は、お月見の季節に合わせて、秋らしい栗のお菓子を選びました。\r\n\r\n###『黄金（こがね）うさぎ』（220円）\r\n\r\n![nakayama (5).jpeg](https://image.loco.kufu.jp/article/1250x_99c9792a-8472-4ab7-85b9-9de792b5a91a.jpeg)\r\n\r\nまずいただいたのは、『黄金（こがね）うさぎ』。\r\n\r\n白く細やかな粉砂糖をまとった姿は、月を見上げる白うさぎを思わせます。\r\n\r\n褐色の薄皮の中には、こしあんと一粒の栗。店内のポップには、「麦こがしまんじゅう」という記載がありました。\r\n\r\n![nakayama.jpeg](https://image.loco.kufu.jp/article/1250x_f72be004-8fad-4087-9f9d-c441a2accb51.jpeg)\r\n\r\n口に含むと、なめらかなこしあんの甘さに栗の風味が重なり、素朴でありながら奥行きのある味わいが広がります。\r\n\r\n見た目の愛らしさも相まって、お月見のひとときにいただきたくなる一品。\r\n\r\nこうした季節の情景まで楽しめるのが、和菓子の魅力なのかもしれません。\r\n\r\n###『葵の栗』（250円）\r\n![nakayama (2).jpeg](https://image.loco.kufu.jp/article/1250x_8cc7a340-ff25-462e-803a-c9330800811c.jpeg)\r\n\r\n小麦色の薄皮には艶やかな照りがあり、ひと目見ただけでも丁寧につくられていることが伝わります。\r\n\r\n中に包まれているのは、黄金色の一粒栗。\r\n\r\n上品な白あんが栗をやさしく包み、ひと口ごとに穏やかな甘みが広がります。\r\n\r\n![nakayama (3).jpeg](https://image.loco.kufu.jp/article/1250x_d81706c4-07ca-419d-9053-90de1ae34541.jpeg)\r\n\r\n華やかすぎることなく、それでいてしっかりと印象に残る味わい。\r\n\r\n秋の午後、温かなお茶とともにゆっくりいただきたくなるお菓子です。\r\n\r\n同じシリーズには『葵の梅』もあります。今回はいただかなかったので、次に訪れたときの楽しみにとっておきたいと思います。\r\n\r\n###人気の『酒まんじゅう』…購入は午前中がおすすめ。\r\n\r\n「わがし屋なかやま」を訪れたなら、ぜひ味わってみたいのが『酒まんじゅう』。\r\n\r\nふんわりとした生地と、やさしい甘さが魅力の昔ながらのおまんじゅうです。\r\n\r\n人気が高く、午前中には売り切れてしまうこともあるそう。\r\n\r\n確実に味わいたい方は、早めの時間に訪れるのがおすすめです。\r\n\r\n今回は残念ながら購入できませんでしたが、次回はぜひ味わってみたい一品です。\r\n\r\n##和菓子の世界に、洋のエッセンスを。『鬼に金棒』（220円）\r\n\r\nそして、こちらのお店を訪れたら、ぜひ味わっていただきたいのが『鬼に金棒』。\r\n\r\n名前も印象的なデニッシュコロネです。\r\n\r\n香ばしく焼き上げたサクサクの生地。（ポップには「デニッシュ」との記載ですが、食べた印象は個人的には「パイ」だと思いました。）\r\n\r\nその中に詰められているのは、和菓子に欠かせない小豆の入ったクリーム。\r\n\r\nクリームは注文を受けてから詰めてくださるため、できたてのおいしさを楽しめるのです。\r\n\r\n![nakayama (10).jpeg](https://image.loco.kufu.jp/article/1250x_8ca6a105-6232-465a-9939-aa7a53d9c3fe.jpeg)\r\n\r\nひと口いただけば、デニッシュの軽やかな食感と香ばしさが広がり、後から小豆とクリームのやさしい風味が追いかけてきます。\r\n\r\nクリームは甘さを抑えてあり、デニッシュとのバランスも絶妙。\r\n\r\n和菓子と洋菓子…異なるふたつの世界が見事に調和。老舗の和菓子店で、このような新鮮な味わいに出会えるとは。\r\n\r\n思わずもう一つ、と手を伸ばしたくなるおいしさでした。\r\n\r\n![nakayama (11).jpeg](https://image.loco.kufu.jp/article/1250x_b717cc8d-aad5-4156-9be2-873fd6c7ef23.jpeg)\r\n\r\n##結びに\r\n\r\n今回ご紹介しきれなかったお菓子はまだまだたくさん。次回来店の楽しみが増しました。\r\n\r\n皆さまも、季節を楽しむようにお菓子を選んでみてはいかがでしょうか。贈る人、贈られる人、全ての方が笑顔あふれるお菓子に出会えますよ。\r\n\r\n\r\n\u003cdiv class=\"facility_information\"\u003e\r\n\u003cb\u003e■わがし屋なかやま\u003c/b\u003e\u003cbr\u003e\r\n住所：〒420-0873 静岡県静岡市葵区籠上12−54\u003cbr\u003e\r\n電話：054-271-5250　\u003cbr\u003e\r\n営業時間：8:30～18:00　\u003cbr\u003e\r\n定休日：木曜\u003cbr\u003e\r\n駐車場：あり\u003cbr\u003e\r\n\u003c/div\u003e\r\n\r\n\r\n\u003ciframe src=\"https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d6536.982863748989!2d138.3678484308488!3d34.99440142819032!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x601a4a45985df42d%3A0x88cf4c7377f2fc0a!2z44KP44GM44GX5bGL44Gq44GL44KE44G-!5e0!3m2!1sja!2sjp!4v1786488990807!5m2!1sja!2sjp\" width=\"600\" height=\"450\" style=\"border:0;\" allowfullscreen=\"\" loading=\"lazy\" referrerpolicy=\"strict-origin-when-cross-origin\"\u003e\r\n\r\n\r\n※この記事は2026年8月時点での情報を基に作成しています。\u003cbr\u003e\r\n※施設・店舗情報は公式サイトおよびGoogleマップの情報を基に作成しています。","prFlag":false,"updatedAt":"2026-08-26T17:03:10.459+09:00","publishedAt":"2026-08-27T06:00:00.000+09:00","thumbnailImageUrl":"https://image.loco.kufu.jp/article/1250x_7749412e-ced5-4091-8537-d42150e2e506.jpeg","posterNickname":"","editorName":"山ちゃん","mediaName":"くふうロコしずおか","newsType":"article"}],"pageInfo":{"totalCount":2765,"currentPage":1,"itemSize":25}},"dataUpdateCount":1,"dataUpdatedAt":1788935
